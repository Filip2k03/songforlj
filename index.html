<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kyal Sin Htet's Romantic Home</title>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Reset & Base --- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            height: 100vh;
            width: 100vw;
            touch-action: none; /* Prevent scroll on mobile */
        }

        /* --- 3D Canvas --- */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* Top Controls */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
            padding: 10px;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .features-grid {
            display: none; /* Hidden by default */
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        .features-grid.open { display: grid; }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-btn.active { background: #ff69b4; border-color: #ff69b4; }
        .control-btn:hover { background: rgba(255, 105, 180, 0.6); transform: scale(1.1); }
        .control-btn.small { width: 35px; height: 35px; font-size: 0.9rem; border-radius: 8px; }

        /* The Lyrics/Main Card */
        #content-card {
            background: rgba(20, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 192, 203, 0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 90%;
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            display: none;
        }

        #content-card.visible {
            opacity: 1;
            display: block;
            transform: translate(-50%, -50%) scale(1);
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem;
            background: linear-gradient(to right, #ff9a9e, #fecfef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(255,20,147,0.3);
        }

        .lyric-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            min-height: 4em;
            color: #fff0f5;
            margin: 15px 0;
            font-style: italic;
            line-height: 1.6;
        }

        /* Attribution */
        .attribution {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            pointer-events: auto;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .attribution small { display: block; color: rgba(255,255,255,0.8); font-size: 0.8rem; letter-spacing: 1px; }
        .attribution strong { color: #ff69b4; font-size: 1.1rem; }

        /* Instruction Tooltip */
        #interaction-hint {
            position: absolute;
            bottom: 12%;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0,0,0,0.6);
            padding: 10px 25px;
            border-radius: 30px;
            pointer-events: none;
            transition: opacity 0.5s;
            animation: pulse 2s infinite;
            backdrop-filter: blur(4px);
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        /* Buttons */
        .action-btn {
            padding: 12px 30px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s;
            font-size: 1rem;
        }
        .action-btn:hover { transform: translateY(-2px); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff69b4;
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            transition: opacity 1s;
        }

        /* --- Mobile Responsive Styles --- */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .lyric-text { font-size: 1rem; }
            #content-card { padding: 20px; width: 95%; }
            .control-btn { width: 40px; height: 40px; }
            .attribution { bottom: 10px; right: 10px; }
            .attribution small { font-size: 0.7rem; }
            .attribution strong { font-size: 1rem; }
            #interaction-hint { bottom: 15%; font-size: 0.9rem; padding: 8px 15px; }
            
            /* Better touch targets for mobile */
            .control-btn.small { width: 40px; height: 40px; margin: 5px; } 
            .features-grid { grid-template-columns: repeat(3, 1fr); width: 200px; }
        }
    </style>
</head>
<body>

    <div id="loader">Building Your Love...</div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <!-- Top Controls -->
        <div class="top-bar">
            <!-- Left: Quick Toggles -->
            <div style="display: flex; gap: 8px;">
                <button class="control-btn" onclick="toggleMenu()" title="Magic Menu">✨</button>
                <button class="control-btn" onclick="toggleDayNight()" title="Day/Night" id="btn-daynight">☾</button>
            </div>

            <!-- Right: Features Menu -->
            <div class="menu-container">
                <div id="features-menu" class="features-grid">
                    <button class="control-btn small" onclick="toggleRain()" title="Rose Rain">🌹</button>
                    <button class="control-btn small" onclick="toggleSnow()" title="Winter Mode">❄️</button>
                    <button class="control-btn small" onclick="toggleClouds()" title="Clouds">☁️</button>
                    <button class="control-btn small" onclick="launchFireworkManual()" title="Firework">🎆</button>
                    <button class="control-btn small" onclick="toggleAutoRotate()" title="Auto Rotate">🔄</button>
                    <button class="control-btn small" onclick="toggleFog()" title="Mist">🌫️</button>
                    <button class="control-btn small" onclick="changeLightColor()" title="Disco Lights">💡</button>
                    <button class="control-btn small" onclick="spawnBirds()" title="Birds">🕊️</button>
                    <button class="control-btn small" onclick="toggleRainbow()" title="Rainbow">🌈</button>
                </div>
            </div>
        </div>

        <!-- Hint -->
        <div id="interaction-hint">Tap the Door, Mailbox, or Ground...</div>
        
        <!-- Main Content Card -->
        <div id="content-card">
            <h1 id="card-title">Welcome</h1>
            <div id="card-body" class="lyric-text">...</div>
            <button class="action-btn" onclick="closeCard()">Close</button>
        </div>

        <!-- Attribution -->
        <div class="attribution">
            <small>For <b>Kyal Sin Htet</b></small>
            <small>From</small>
            <strong>Stephan Filip</strong>
        </div>
    </div>

    <!-- Hidden Audio -->
    <audio id="bg-music" loop>
        <source src="" type="audio/mp3">
    </audio>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            colors: {
                nightBg: 0x0a0510,
                dayBg: 0x87CEEB,
                houseWall: 0xffe4e1,
                roof: 0xdb7093,
                door: 0x8b4513,
                grass: 0x1a2b1a,
                snow: 0xffffff,
                path: 0x555555
            },
            names: {
                recipient: "Kyal Sin Htet",
                sender: "Stephan Filip"
            }
        };

        const LYRICS = [
            "You’re the light that shines in the night, LJ",
            "Every time I see you, feels like a holiday",
            "Got that smile that lights up the whole street",
            "Heart racing near you, baby, it’s on repeat",
            "Calling your name like a song on replay",
            "Everything you do just feels like fate today",
            "Your laugh lifts me, it takes me so high",
            "There’s no one like you, girl, you make me fly",
            "With you, I’m high, I’m in the clouds",
            "Dreaming ‘bout us, no doubts allowed",
            "In your eyes, I see the stars in line",
            "You’re my peace, my queen, my sunshine"
        ];

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, controls;
        let houseGroup, doorGroup, doorMesh, mailboxMesh, grassMesh;
        let raycaster, mouse;
        let clock = new THREE.Clock();
        
        // Systems
        let roseParticles = [], fireflies = [], snowParticles = [], smokeParticles = [], clouds = [], birds = [], fireworks = [];
        let lanterns = [], flowers = [];

        // New globals
        let signMesh = null;
        let autoFireworksInterval = null;
        let lightBulb = null;
        let starsGroup = null;
        let pathLights = [];
        
        // State
        let isNight = true;
        let isRainingRoses = false;
        let isSnowing = false;
        let isAutoRotate = false;
        let isCloudy = false;
        let isWinter = false;
        let isRainbow = false;
        let rainbowMesh;
        
        // Audio/TTS
        let synth = window.speechSynthesis;
        let currentLineIndex = 0;
        let isPlaying = false;

        // --- INIT ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.nightBg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.nightBg, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 90);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimise for mobile
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 20;
            controls.maxDistance = 150;
            controls.autoRotate = false;
            controls.autoRotateSpeed = 1.0;

            // Lighting
            setupLights();

            // Objects
            createGroundAndPath();
            createHeartHouse();
            createEnvironment(); 
            createChimney();
            createFireflies();
            createFlowers();
            createLightBulb();
            spawnStars();
            addWindowFrames();

            // Interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
            
            // Touch Support
            const canvas = renderer.domElement;
            canvas.addEventListener('touchstart', onTouchStart, { passive: false });

            // Remove Loader
            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 1000);

            // Determine local time and set initial day/night state
            const hour = new Date().getHours();
            // Night if before 7am or after 6pm
            isNight = (hour < 7 || hour >= 18);
            applyDayNightState();

            animate();
        }

        // --- 3D CONSTRUCTION ---

        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xaaccff, 0.5);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024; // Lower res for mobile perf
            dirLight.shadow.mapSize.height = 1024;
            dirLight.name = "MainLight";
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xffaa00, 1, 40);
            pointLight.position.set(0, 15, 15);
            pointLight.castShadow = true;
            pointLight.name = "PorchLight";
            scene.add(pointLight);
        }

        function createGroundAndPath() {
            const planeGeo = new THREE.PlaneGeometry(500, 500);
            const planeMat = new THREE.MeshStandardMaterial({ 
                color: CONFIG.colors.grass, 
                roughness: 1,
                side: THREE.DoubleSide
            });
            grassMesh = new THREE.Mesh(planeGeo, planeMat);
            grassMesh.rotation.x = -Math.PI / 2;
            grassMesh.receiveShadow = true;
            grassMesh.userData = { isInteractable: true, type: 'ground' };
            scene.add(grassMesh);

            const pathGeo = new THREE.PlaneGeometry(12, 80);
            const pathMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.path, roughness: 0.8 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.set(0, 0.1, 50);
            path.receiveShadow = true;
            scene.add(path);

            // Path Lights
            for(let z=20; z<80; z+=15) {
                const l1 = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xffffaa}));
                l1.position.set(-7, 0.5, z);
                scene.add(l1);
                const l2 = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xffffaa}));
                l2.position.set(7, 0.5, z);
                scene.add(l2);
            }
        }

        function createHeartHouse() {
            houseGroup = new THREE.Group();

            // Walls
            const walls = new THREE.Mesh(
                new THREE.BoxGeometry(30, 25, 25),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.houseWall })
            );
            walls.position.y = 12.5;
            walls.castShadow = true;
            walls.receiveShadow = true;
            houseGroup.add(walls);

            // Roof
            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(24, 15, 4),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.roof })
            );
            roof.position.y = 32.5;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            houseGroup.add(roof);

            // Sign
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            function drawSignText(text, color = '#3e2723') {
                ctx.clearRect(0,0,512,128);
                ctx.fillStyle = "rgba(0,0,0,0)"; ctx.fillRect(0,0,512,128);
                ctx.font = 'bold 46px "Playfair Display"';
                ctx.fillStyle = color;
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(text, 256, 64);
            }
            drawSignText(CONFIG.names.recipient + ' LJ');
            const signTex = new THREE.CanvasTexture(canvas);
            signMesh = new THREE.Mesh(
                new THREE.BoxGeometry(18, 4, 1),
                new THREE.MeshStandardMaterial({ map: signTex, color: 0xffffff, emissive: 0x000000, emissiveIntensity: 0 })
            );
            signMesh.position.set(0, 22, 13);
            signMesh.userData = { canvas, ctx, drawSignText };
            houseGroup.add(signMesh);

            // Door Group
            doorGroup = new THREE.Group();
            doorGroup.position.set(-5, 0, 12.6);
            
            doorMesh = new THREE.Mesh(
                new THREE.BoxGeometry(10, 18, 1),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.door })
            );
            doorMesh.position.set(5, 9, 0);
            doorMesh.castShadow = true;
            doorMesh.userData = { isInteractable: true, type: 'door' };
            doorGroup.add(doorMesh);

            // Heart Decor
            const heartShape = new THREE.Shape();
            heartShape.moveTo(25, 25);
            heartShape.bezierCurveTo(25, 25, 20, 0, 0, 0);
            heartShape.bezierCurveTo(-30, 0, -30, 35, -30, 35);
            heartShape.bezierCurveTo(-30, 55, -10, 77, 25, 95);
            heartShape.bezierCurveTo(60, 77, 80, 55, 80, 35);
            heartShape.bezierCurveTo(80, 35, 80, 0, 50, 0);
            heartShape.bezierCurveTo(35, 0, 25, 25, 25, 25);
            
            const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 5, bevelEnabled: false });
            const heartMat = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
            const doorHeart = new THREE.Mesh(heartGeo, heartMat);
            doorHeart.scale.set(0.04, -0.04, 0.04);
            doorHeart.position.set(5, 14, 0.6);
            doorMesh.add(doorHeart);

            // Knob
            const knob = new THREE.Mesh(
                new THREE.SphereGeometry(0.8),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 })
            );
            knob.position.set(8, 9, 0.6);
            doorMesh.add(knob);

            houseGroup.add(doorGroup);
            
            // Windows
            createWindow(-8, 15, 12.6);
            createWindow(8, 15, 12.6);

            scene.add(houseGroup);
        }

        function createWindow(x, y, z) {
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(6, 6, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x443333 })
            );
            frame.position.set(x, y, z);
            houseGroup.add(frame);

            const glass = new THREE.Mesh(
                new THREE.BoxGeometry(5, 5, 0.6),
                new THREE.MeshBasicMaterial({ color: 0xffffaa, transparent: true, opacity: 0.9 })
            );
            glass.position.set(x, y, z);
            glass.userData = { isInteractable: true, type: 'window' };
            houseGroup.add(glass);
        }

        function createChimney() {
            const chimney = new THREE.Mesh(
                new THREE.BoxGeometry(4, 8, 4),
                new THREE.MeshStandardMaterial({ color: 0x555555 })
            );
            chimney.position.set(8, 30, -5);
            houseGroup.add(chimney);
        }

        function createEnvironment() {
            // Mailbox
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 10), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
            post.position.set(15, 5, 40); scene.add(post);

            mailboxMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 6), new THREE.MeshStandardMaterial({ color: 0xcc0000 }));
            mailboxMesh.position.set(15, 10, 40);
            mailboxMesh.userData = { isInteractable: true, type: 'mailbox' };
            scene.add(mailboxMesh);

            // Lanterns
            const positions = [[-10, 30], [10, 30], [-10, 60], [10, 60]];
            positions.forEach(pos => {
                const lg = new THREE.Group();
                lg.position.set(pos[0], 0, pos[1]);
                
                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 8), new THREE.MeshStandardMaterial({color: 0x222222}));
                pole.position.y = 4; lg.add(pole);

                const glass = new THREE.Mesh(new THREE.BoxGeometry(2, 3, 2), new THREE.MeshBasicMaterial({color: 0xffffaa, opacity: 0.8, transparent: true}));
                glass.position.y = 8; glass.userData = {isInteractable:true, type:'lantern'}; lg.add(glass);

                const light = new THREE.PointLight(0xffaa00, 0.8, 15);
                light.position.y = 8; lg.add(light);
                lanterns.push(light);
                scene.add(lg);
            });

            // Trees
            for(let i=0; i<8; i++) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.5, 5), new THREE.MeshStandardMaterial({color: 0x5d4037}));
                trunk.position.y = 2.5; tree.add(trunk);
                
                const leaves = new THREE.Mesh(new THREE.ConeGeometry(6, 12, 8), new THREE.MeshStandardMaterial({color: 0x2d5a27}));
                leaves.position.y = 8; tree.add(leaves);
                
                const angle = Math.random() * Math.PI * 2;
                const r = 40 + Math.random() * 60;
                tree.position.set(Math.cos(angle)*r, 0, Math.sin(angle)*r);
                if (Math.abs(tree.position.x) < 15 && tree.position.z > 0) tree.position.x += 30;
                scene.add(tree);
            }
        }

        function createFlowers() {
            const geo = new THREE.PlaneGeometry(1, 1);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff69b4, side: THREE.DoubleSide });
            
            for(let i=0; i<50; i++) {
                const flower = new THREE.Mesh(geo, mat);
                const r = 20 + Math.random() * 60;
                const theta = Math.random() * Math.PI * 2;
                flower.position.set(Math.cos(theta)*r, 0.5, Math.sin(theta)*r);
                flower.rotation.y = Math.random() * Math.PI;
                flower.rotation.x = -0.2; // Tilt slightly up
                
                // Avoid path
                if(Math.abs(flower.position.x) > 8 || flower.position.z < 0) {
                    scene.add(flower);
                    flowers.push(flower);
                }
            }
        }

        function createRainbow() {
            if(rainbowMesh) return;
            const geo = new THREE.TorusGeometry(80, 2, 16, 100, Math.PI);
            const mat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, vertexColors: true, transparent: true, opacity: 0.4 
            });
            // Vertex colors for rainbow gradient... (Simplified here as single color for brevity, usually needs shader or texture)
            // Using a simple color for now
            rainbowMesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xadd8e6, transparent: true, opacity: 0.0 }));
            rainbowMesh.position.set(0, -10, -50);
            scene.add(rainbowMesh);
        }

        // --- Additional Features (many small helpers) ---

        function setSignText(text, color) {
            if(!signMesh || !signMesh.userData) return;
            signMesh.userData.drawSignText(text, color || '#3e2723');
            signMesh.material.map.needsUpdate = true;
        }

        function toggleSignGlow(enable) {
            if(!signMesh) return;
            if(enable === undefined) enable = isNight;
            if(enable) {
                signMesh.material.emissive.setHex(0xff88cc);
                signMesh.material.emissiveIntensity = 1.2;
            } else {
                signMesh.material.emissive.setHex(0x000000);
                signMesh.material.emissiveIntensity = 0;
            }
        }

        function createLightBulb() {
            const bulb = new THREE.Mesh(new THREE.SphereGeometry(1.2, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0x000000 }));
            bulb.position.set(0, 26, 16);
            const light = new THREE.PointLight(0xffeeaa, 0, 20);
            light.position.copy(bulb.position);
            light.name = 'BulbLight';
            scene.add(bulb);
            scene.add(light);
            lightBulb = { mesh: bulb, light };
        }

        function toggleLightBulb() {
            if(!lightBulb) return;
            const on = lightBulb.light.intensity === 0;
            lightBulb.light.intensity = on ? 1.2 : 0;
            lightBulb.mesh.material.emissive.setHex(on ? 0xfff0cc : 0x000000);
        }

        function createRealisticFirework(x=0, y=60, z=0, color) {
            const parts = [];
            for(let i=0;i<80;i++){
                const geo = new THREE.SphereGeometry(0.25,6,6);
                const mat = new THREE.MeshBasicMaterial({ color: color || new THREE.Color(Math.random(), Math.random(), Math.random()) });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(x, y, z);
                p.userData = { vel: new THREE.Vector3((Math.random()-0.5)*6, Math.random()*6, (Math.random()-0.5)*6), life: 1.0 };
                scene.add(p); parts.push(p);
            }
            fireworks.push(...parts.map(m => ({ mesh: m, vel: m.userData.vel, life: m.userData.life })));
        }

        function createRainbowFirework(x,y,z) {
            const hues = [0, 30, 60, 120, 180, 240, 300];
            for(let h of hues){
                const color = new THREE.Color(`hsl(${h},100%,60%)`);
                createRealisticFirework(x, y + (Math.random()*10-5), z, color);
            }
        }

        function playFireworkSequence(count=6) {
            for(let i=0;i<count;i++){
                setTimeout(()=>{
                    const x = (Math.random()-0.5)*120;
                    const z = (Math.random()-0.5)*120 - 20;
                    if(Math.random()>0.5) createRainbowFirework(x, 60 + Math.random()*20, z);
                    else createRealisticFirework(x, 60 + Math.random()*20, z);
                }, i*700);
            }
        }

        function startAutoFireworks(intervalMs=5000) {
            if(autoFireworksInterval) return;
            autoFireworksInterval = setInterval(()=> playFireworkSequence(3), intervalMs);
        }

        function stopAutoFireworks() {
            if(!autoFireworksInterval) return;
            clearInterval(autoFireworksInterval); autoFireworksInterval = null;
        }

        function addPorchDetail() {
            const porch = new THREE.Mesh(new THREE.BoxGeometry(12,1,8), new THREE.MeshStandardMaterial({ color: 0x8b5a2b }));
            porch.position.set(0,0.5,18); porch.receiveShadow = true; scene.add(porch);
        }

        function addWindowFrames() {
            // Add small frames around windows to increase realism
            const frames = [];
            const positions = [[-8,15,12.6],[8,15,12.6]];
            positions.forEach(p=>{
                const f = new THREE.Mesh(new THREE.BoxGeometry(6.2,6.2,0.2), new THREE.MeshStandardMaterial({color:0x332211}));
                f.position.set(p[0],p[1],p[2]+0.3); scene.add(f); frames.push(f);
            });
        }

        function addRoofTiles() {
            // Simple tile pattern across roof
            for(let i=-10;i<=10;i+=2){
                for(let j=-6;j<=6;j+=1.5){
                    const t = new THREE.Mesh(new THREE.BoxGeometry(2,0.2,1.2), new THREE.MeshStandardMaterial({color:0x9b3f5b}));
                    t.position.set(i, 37 + Math.random()*0.4, j); t.rotation.y = Math.random()*0.1; scene.add(t);
                }
            }
        }

        function addInteriorLights() {
            scene.traverse(o=>{
                if(o.userData && o.userData.type === 'window'){
                    const li = new THREE.PointLight(0xfff3cc, 0.0, 20);
                    li.position.set(o.position.x, o.position.y, o.position.z+2);
                    scene.add(li);
                    o.userData.interiorLight = li;
                }
            });
        }

        function toggleInteriorLights() {
            scene.traverse(o=>{
                if(o.userData && o.userData.interiorLight){
                    const L = o.userData.interiorLight; L.intensity = L.intensity > 0 ? 0 : 0.9;
                }
            });
        }

        function spawnStars() {
            if(starsGroup) return;
            starsGroup = new THREE.Group();
            const geo = new THREE.BufferGeometry();
            const pts = [];
            for(let i=0;i<300;i++) pts.push((Math.random()-0.5)*400, 80+Math.random()*60, (Math.random()-0.5)*400);
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent:true, opacity:0.9 });
            const p = new THREE.Points(geo, mat); starsGroup.add(p); scene.add(starsGroup);
            starsGroup.visible = isNight;
        }

        function toggleStars() { if(starsGroup) starsGroup.visible = !starsGroup.visible; }

        function spawnConfetti(x=0,y=50,z=0) {
            for(let i=0;i<80;i++){
                const geo = new THREE.PlaneGeometry(0.5,0.7);
                const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(Math.random(),Math.random(),Math.random()), side:THREE.DoubleSide });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(x + (Math.random()-0.5)*20, y + Math.random()*20, z + (Math.random()-0.5)*20);
                p.rotation.set(Math.random(),Math.random(),Math.random()); scene.add(p);
                fireworks.push({ mesh: p, vel: new THREE.Vector3((Math.random()-0.5)*0.6, -0.2 - Math.random()*0.6, (Math.random()-0.5)*0.6), life: 2.0 });
            }
        }

        function togglePathLights() {
            if(pathLights.length === 0) {
                scene.traverse(o => { if(o.geometry && o.geometry.type === 'SphereGeometry' && o.position.z > 0) pathLights.push(o); });
            }
            pathLights.forEach(p=> p.visible = !p.visible);
        }

        function toggleHouseDetail() { addPorchDetail(); addRoofTiles(); }

        function toggleShadows() { renderer.shadowMap.enabled = !renderer.shadowMap.enabled; }

        function cycleSkyColors() {
            const c1 = new THREE.Color(Math.random()*0xffffff);
            const c2 = new THREE.Color(Math.random()*0xffffff);
            scene.background = c1; scene.fog.color = c2;
        }

        function randomizeLanternColors() { lanterns.forEach(l => l.color.setHex(Math.random()*0xffffff)); }


        // --- PARTICLE SYSTEMS ---

        function createFireflies() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for (let i = 0; i < 50; i++) pos.push((Math.random()-0.5)*150, Math.random()*40, (Math.random()-0.5)*150);
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffff00, size: 0.8, transparent: true });
            const pts = new THREE.Points(geo, mat);
            scene.add(pts);
            fireflies.push(pts);
        }

        function spawnSmoke() {
            if(Math.random() > 0.1) return;
            const geo = new THREE.SphereGeometry(Math.random()*0.8 + 0.5, 4, 4);
            const mat = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.6 });
            const p = new THREE.Mesh(geo, mat);
            p.position.set(8 + (Math.random()-0.5), 34, -5 + (Math.random()-0.5));
            scene.add(p);
            smokeParticles.push(p);
        }

        function spawnSnow() {
            const geo = new THREE.PlaneGeometry(0.3, 0.3);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
            const p = new THREE.Mesh(geo, mat);
            p.position.set((Math.random()-0.5)*200, 100, (Math.random()-0.5)*200);
            p.rotation.set(Math.random(), Math.random(), Math.random());
            scene.add(p);
            snowParticles.push(p);
        }

        function spawnBirds() {
            for(let i=0; i<5; i++) {
                const geo = new THREE.ConeGeometry(0.5, 2, 4);
                const mat = new THREE.MeshBasicMaterial({ color: 0x333333 });
                const b = new THREE.Mesh(geo, mat);
                b.rotation.x = Math.PI / 2;
                b.position.set(-100 - i*2, 60 + Math.random()*5, -50 + i*2);
                scene.add(b);
                birds.push({ mesh: b, speed: 0.2 + Math.random()*0.1 });
            }
        }

        function launchFireworkManual() {
            const color = new THREE.Color().setHSL(Math.random(), 1, 0.5);
            const x = (Math.random() - 0.5) * 80;
            const z = (Math.random() - 0.5) * 80 - 20;
            
            // Explosion particles
            for(let i=0; i<30; i++) {
                const geo = new THREE.SphereGeometry(0.5);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const p = new THREE.Mesh(geo, mat);
                p.position.set(x, 60, z);
                
                const velocity = new THREE.Vector3(
                    (Math.random()-0.5) * 2,
                    (Math.random()-0.5) * 2,
                    (Math.random()-0.5) * 2
                );
                
                scene.add(p);
                fireworks.push({ mesh: p, vel: velocity, life: 1.0 });
            }
        }

        function spawnFloatingHeart(x, z) {
            const shape = new THREE.Shape();
            const width = 1, height = 1;
            shape.moveTo(0,0);
            shape.bezierCurveTo(width/2, height/2, width, 0, width, -height/2);
            shape.bezierCurveTo(width, -height, width/2, -height*1.5, 0, -height*2);
            shape.bezierCurveTo(-width/2, -height*1.5, -width, -height, -width, -height/2);
            shape.bezierCurveTo(-width, 0, -width/2, height/2, 0, 0);

            const geo = new THREE.ShapeGeometry(shape);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff69b4, side: THREE.DoubleSide });
            const heart = new THREE.Mesh(geo, mat);
            heart.position.set(x, 1, z);
            heart.rotation.x = Math.PI; // Flip upright
            heart.scale.set(0.5, 0.5, 0.5);
            scene.add(heart);
            
            // Reuse roseParticles logic for rising effect
            roseParticles.push(heart); 
        }

        // --- INTERACTION & LOGIC ---

        function onTouchStart(event) {
            event.preventDefault(); // Prevent scrolling
            // Use the first touch
            mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
            
            // Check interaction directly on touch start
            checkIntersection(true);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            checkIntersection(false);
        }

        function onMouseClick() {
            checkIntersection(true);
        }

        function checkIntersection(isClick) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            let foundInteractable = false;

            if (intersects.length > 0) {
                // Find first interactable parent
                let obj = intersects[0].object;
                let interactable = null;
                
                // Traverse up
                while(obj) {
                    if (obj.userData && obj.userData.isInteractable) {
                        interactable = obj;
                        break;
                    }
                    obj = obj.parent;
                }

                if (interactable) {
                    foundInteractable = true;
                    document.body.style.cursor = 'pointer';
                    
                    if (isClick) {
                        handleInteraction(interactable.userData.type, interactable, intersects[0].point);
                    } else if (interactable.material && interactable.material.emissive) {
                        // Hover glow
                        interactable.material.emissive.setHex(0x333333);
                    }
                } else if (isClick && intersects[0].object === grassMesh) {
                    // Click on ground spawns heart
                    spawnFloatingHeart(intersects[0].point.x, intersects[0].point.z);
                }
            }

            if (!foundInteractable) {
                document.body.style.cursor = 'grab';
                scene.traverse(child => {
                    if (child.material && child.material.emissive) child.material.emissive.setHex(0x000000);
                });
            }
        }

        function handleInteraction(type, object, point) {
            if (type === 'door') openDoorAndPlay();
            else if (type === 'mailbox') showLoveLetter();
            else if (type === 'lantern') toggleLantern(object);
            else if (type === 'window') toggleWindowLight(object);
        }

        // --- ACTIONS ---

        function openDoorAndPlay() {
            if(isPlaying) return;
            
            // Door Animation
            const targetRot = -Math.PI / 1.5;
            let alpha = 0;
            const i = setInterval(() => {
                alpha += 0.05;
                doorGroup.rotation.y = THREE.MathUtils.lerp(0, targetRot, alpha);
                if(alpha >= 1) clearInterval(i);
            }, 16);

            // Camera Zoom
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(0, 15, 35);
            let cA = 0;
            const cI = setInterval(() => {
                cA += 0.02;
                camera.position.lerpVectors(startPos, endPos, cA);
                if(cA >= 1) clearInterval(cI);
            }, 16);

            showCard("For My Sunshine");
            document.getElementById('interaction-hint').style.opacity = 0;
            startSong();
        }

        function showLoveLetter() {
            showCard("A Note for You");
            const letter = `
                "My Dearest ${CONFIG.names.recipient},<br><br>
                Every brick of this house represents a moment we've shared.<br>
                This digital world is small, but my love for you is infinite.<br><br>
                Yours always,<br>${CONFIG.names.sender}"
            `;
            document.getElementById('card-body').innerHTML = letter;
        }

        function toggleLantern(mesh) {
            mesh.parent.children.forEach(c => {
                if(c.isPointLight) c.intensity = c.intensity > 0 ? 0 : 1;
            });
        }

        function toggleWindowLight(mesh) {
            mesh.material.opacity = mesh.material.opacity > 0.5 ? 0.2 : 0.9;
            mesh.material.color.setHex(mesh.material.opacity > 0.5 ? 0xffffaa : 0x000000);
        }

        // --- FEATURES & TOGGLES ---

        function toggleMenu() {
            const menu = document.getElementById('features-menu');
            menu.classList.toggle('open');
        }

        // Apply visual changes according to the current `isNight` value
        function applyDayNightState() {
            const bg = isNight ? CONFIG.colors.nightBg : CONFIG.colors.dayBg;
            scene.background.setHex(bg);
            scene.fog.color.setHex(bg);

            const mainLight = scene.getObjectByName("MainLight");
            if(mainLight) {
                mainLight.intensity = isNight ? 0.5 : 1.2;
                mainLight.color.setHex(isNight ? 0xaaccff : 0xffffee);
            }

            // Porch light / Path lights and lanterns
            const porch = scene.getObjectByName("PorchLight");
            if(porch) porch.intensity = isNight ? 1.0 : 0.8;

            lanterns.forEach(l => l.intensity = isNight ? 0.8 : 0.0);

            // Fireflies only at night
            fireflies.forEach(f => f.visible = isNight);

            // Sign glow: find sign mesh (we created it in createHeartHouse)
            scene.traverse(o => {
                if(o.isMesh && o.geometry && o.geometry.parameters && o.geometry.parameters.width === 18) {
                    if(o.material && o.material.emissive !== undefined) {
                        if(isNight) {
                            o.material.emissive.setHex(0xffbb88);
                            o.material.emissiveIntensity = 0.9;
                        } else {
                            o.material.emissive.setHex(0x000000);
                            o.material.emissiveIntensity = 0;
                        }
                    }
                }
            });

            // UI button icon update
            const btn = document.getElementById('btn-daynight');
            if(btn) btn.innerText = isNight ? '☾' : '☀';
        }

        function toggleDayNight() {
            isNight = !isNight;
            applyDayNightState();
        }

        function toggleRain() { isRainingRoses = !isRainingRoses; }
        function toggleSnow() { 
            isSnowing = !isSnowing;
            isWinter = !isWinter;
            // Update materials for winter look
            grassMesh.material.color.setHex(isWinter ? 0xffffff : CONFIG.colors.grass);
            scene.traverse(o => {
                if(o.type === 'Group') { // Trees
                   o.children.forEach(c => {
                       if(c.geometry && c.geometry.type === 'ConeGeometry') {
                           c.material.color.setHex(isWinter ? 0xeeeeee : 0x2d5a27);
                       }
                   });
                }
            });
        }
        function toggleClouds() { 
            isCloudy = !isCloudy;
            if(isCloudy && clouds.length === 0) {
                // Create Clouds
                for(let i=0; i<5; i++) {
                    const c = new THREE.Mesh(new THREE.SphereGeometry(8, 8, 8), new THREE.MeshBasicMaterial({color: 0xffffff, transparent:true, opacity:0.8}));
                    c.position.set((Math.random()-0.5)*200, 80 + Math.random()*20, -50 + Math.random()*50);
                    c.scale.x = 2;
                    scene.add(c);
                    clouds.push(c);
                }
            }
            clouds.forEach(c => c.visible = isCloudy);
        }
        function toggleAutoRotate() { 
            isAutoRotate = !isAutoRotate;
            controls.autoRotate = isAutoRotate; 
        }
        function toggleFog() {
            scene.fog.density = scene.fog.density > 0.01 ? 0.005 : 0.04;
        }
        function changeLightColor() {
            lanterns.forEach(l => l.color.setHex(Math.random() * 0xffffff));
            const porch = scene.getObjectByName("PorchLight");
            if(porch) porch.color.setHex(Math.random() * 0xffffff);
        }
        function toggleRainbow() {
            if(!rainbowMesh) createRainbow();
            isRainbow = !isRainbow;
            rainbowMesh.material.opacity = isRainbow ? 0.5 : 0.0;
        }

        // --- ANIMATION LOOP ---

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            controls.update();

            // Fireflies
            if(isNight && fireflies.length > 0) {
                const pos = fireflies[0].geometry.attributes.position.array;
                for(let i=0; i<pos.length; i+=3) {
                    pos[i+1] += Math.sin(Date.now()*0.001 + pos[i])*0.05;
                }
                fireflies[0].geometry.attributes.position.needsUpdate = true;
            }

            // Smoke
            spawnSmoke();
            for(let i=smokeParticles.length-1; i>=0; i--) {
                const p = smokeParticles[i];
                p.position.y += 0.1;
                p.material.opacity -= 0.01;
                if(p.material.opacity <= 0) { scene.remove(p); smokeParticles.splice(i,1); }
            }

            // Rain/Hearts rising
            if(isRainingRoses) {
               if(Math.random()>0.8) {
                    const geo = new THREE.PlaneGeometry(0.5, 0.5);
                    const mat = new THREE.MeshBasicMaterial({color: 0xff007f, side:THREE.DoubleSide});
                    const p = new THREE.Mesh(geo, mat);
                    p.position.set((Math.random()-0.5)*100, 100, (Math.random()-0.5)*100);
                    scene.add(p);
                    roseParticles.push(p);
               }
            }

            // Handle particles (Rose/Hearts/Snow)
            for(let i=roseParticles.length-1; i>=0; i--) {
                const p = roseParticles[i];
                if(p.geometry.type === 'ShapeGeometry') { // Rising Hearts
                    p.position.y += 0.1;
                    p.material.opacity -= 0.005;
                    if(p.position.y > 20) { scene.remove(p); roseParticles.splice(i,1); }
                } else { // Falling Roses
                    p.position.y -= 0.2; p.rotation.x += 0.05;
                    if(p.position.y < 0) { scene.remove(p); roseParticles.splice(i,1); }
                }
            }

            if(isSnowing) {
                if(Math.random()>0.5) spawnSnow();
                for(let i=snowParticles.length-1; i>=0; i--) {
                    const p = snowParticles[i];
                    p.position.y -= 0.1; p.position.x += Math.sin(Date.now()*0.001)*0.02;
                    if(p.position.y < 0) { scene.remove(p); snowParticles.splice(i,1); }
                }
            }

            // Birds
            birds.forEach(b => {
                b.mesh.position.x += b.speed;
                b.mesh.position.y += Math.sin(Date.now()*0.002)*0.05;
                if(b.mesh.position.x > 100) b.mesh.position.x = -100;
            });

            // Clouds
            clouds.forEach(c => {
                c.position.x += 0.02;
                if(c.position.x > 150) c.position.x = -150;
            });

            // Fireworks
            for(let i=fireworks.length-1; i>=0; i--) {
                const fw = fireworks[i];
                fw.mesh.position.add(fw.vel);
                fw.vel.y -= 0.02; // Gravity
                fw.life -= 0.02;
                fw.mesh.material.opacity = fw.life;
                if(fw.life <= 0) { scene.remove(fw.mesh); fireworks.splice(i,1); }
            }

            // Flowers sway
            flowers.forEach((f, idx) => {
                f.rotation.z = Math.sin(Date.now()*0.002 + idx)*0.1;
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- UI HELPERS ---

        function showCard(title) {
            const card = document.getElementById('content-card');
            card.classList.add('visible');
            document.getElementById('card-title').innerText = title;
        }

        function closeCard() {
            document.getElementById('content-card').classList.remove('visible');
            stopExperience();
            
            // Close door
            doorGroup.rotation.y = 0; 
            
            // Reset Camera
            const endPos = new THREE.Vector3(0, 20, 90);
            let a = 0;
            const i = setInterval(() => {
                a += 0.05;
                camera.position.lerp(endPos, 0.1);
                if(camera.position.distanceTo(endPos) < 1) clearInterval(i);
            }, 20);

            document.getElementById('interaction-hint').style.opacity = 1;
        }

        // --- AUDIO ---

        function startSong() {
            isPlaying = true;
            currentLineIndex = 0;
            speakNextLine();
        }

        function stopExperience() {
            synth.cancel();
            isPlaying = false;
        }

        function speakNextLine() {
            if (!isPlaying || currentLineIndex >= LYRICS.length) return;

            const text = LYRICS[currentLineIndex];
            const display = document.getElementById('card-body');
            display.style.opacity = 0;
            
            setTimeout(() => {
                display.innerText = text;
                display.style.opacity = 1;
            }, 300);

            const u = new SpeechSynthesisUtterance(text);
            u.pitch = 1; u.rate = 0.9; u.volume = 1;
            const voices = synth.getVoices();
            const v = voices.find(v => v.name.includes("Google US English") || v.name.includes("Samantha"));
            if(v) u.voice = v;

            u.onend = () => {
                currentLineIndex++;
                if(isPlaying) setTimeout(speakNextLine, 800);
            };

            synth.speak(u);
        }

        // Init
        window.onload = init;

    </script>
