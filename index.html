<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kyal Sin Htet's Romantic Home</title>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Reset & Base --- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body {
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            height: 100vh;
            width: 100vw;
            touch-action: none; /* Prevent scroll on mobile */
        }

        /* --- 3D Canvas --- */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* Top Controls */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
            padding: 10px;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .features-grid {
            display: none; /* Hidden by default */
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            background: rgba(0,0,0,0.55);
            padding: 12px;
            border-radius: 14px;
            backdrop-filter: blur(6px);
            transform-origin: top right;
            transition: transform 280ms cubic-bezier(.2,.9,.2,1), opacity 240ms;
            opacity: 0;
        }
        .features-grid.open { display: grid; transform: translateY(6px) scale(1); opacity: 1; }

        /* Top toolbar additions */
        .top-toolbar { display:flex; gap:8px; align-items:center; }
        .control-row { display:flex; gap:8px; align-items:center; }
        .small-select { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.12); padding:6px 8px; border-radius:8px; }

        .control-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            width: 45px; height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .control-btn.active { background: #ff69b4; border-color: #ff69b4; }
        .control-btn:hover { background: rgba(255, 105, 180, 0.6); transform: scale(1.1); }
        .control-btn.small { width: 35px; height: 35px; font-size: 0.9rem; border-radius: 8px; }

        /* The Lyrics/Main Card */
        #content-card {
            background: rgba(20, 10, 20, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 192, 203, 0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 90%;
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            display: none;
        }

        #content-card.visible {
            opacity: 1;
            display: block;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Content card controls */
        .card-controls { margin-top: 12px; display:flex; gap:8px; justify-content:center; align-items:center; }
        .icon-btn { background: rgba(255,255,255,0.06); border: none; color: white; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
        .icon-btn:focus { outline: 2px solid rgba(255,105,180,0.45); }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem;
            background: linear-gradient(to right, #ff9a9e, #fecfef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(255,20,147,0.3);
        }

        .lyric-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            min-height: 4em;
            color: #fff0f5;
            margin: 15px 0;
            font-style: italic;
            line-height: 1.6;
        }

        /* Attribution */
        .attribution {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            pointer-events: auto;
            font-family: 'Playfair Display', serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .attribution small { display: block; color: rgba(255,255,255,0.8); font-size: 0.8rem; letter-spacing: 1px; }
        .attribution strong { color: #ff69b4; font-size: 1.1rem; }

        /* Instruction Tooltip */
        #interaction-hint {
            position: absolute;
            bottom: 12%;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.95);
            background: rgba(0,0,0,0.6);
            padding: 10px 25px;
            border-radius: 30px;
            pointer-events: none;
            transition: opacity 0.5s;
            animation: pulse 2s infinite;
            backdrop-filter: blur(4px);
            text-align: center;
            width: 80%;
            max-width: 400px;
        }

        /* Buttons */
        .action-btn {
            padding: 12px 30px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s;
            font-size: 1rem;
        }
        .action-btn:hover { transform: translateY(-2px); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff69b4;
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            transition: opacity 1s;
        }

        /* --- Mobile Responsive Styles --- */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .lyric-text { font-size: 1rem; }
            #content-card { padding: 20px; width: 95%; }
            .control-btn { width: 40px; height: 40px; }
            .attribution { bottom: 10px; right: 10px; }
            .attribution small { font-size: 0.7rem; }
            .attribution strong { font-size: 1rem; }
            #interaction-hint { bottom: 15%; font-size: 0.9rem; padding: 8px 15px; }
            
            /* Better touch targets for mobile */
            .control-btn.small { width: 40px; height: 40px; margin: 5px; } 
            .features-grid { grid-template-columns: repeat(3, 1fr); width: 200px; }
        }
    </style>
</head>
<body>

    <div id="loader">Building Your Love...</div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <!-- Top Controls -->
        <div class="top-bar">
            <!-- Left: Quick Toggles -->
            <div class="top-toolbar" style="display: flex; gap: 8px;">
                <div style="display:flex; gap:8px; align-items:center;" class="control-row">
                    <button class="control-btn" onclick="toggleMenu()" title="Magic Menu" aria-label="Open features menu">✨</button>
                    <button class="control-btn" onclick="toggleDayNight()" title="Day/Night" id="btn-daynight" aria-pressed="true">☾</button>
                </div>
                <div style="display:flex; gap:8px; align-items:center; margin-left:8px;" class="control-row">
                    <button class="control-btn" id="btn-play" onclick="togglePlay()" title="Play/Pause" aria-pressed="false">▶️</button>
                    <button class="control-btn" onclick="photoMode()" title="Photo Mode" aria-label="Photo Mode">📸</button>
                    <button class="control-btn" onclick="toggleFullscreen()" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
                </div>
            </div>

            <!-- Right: Features Menu -->
            <div class="menu-container">
                <div id="features-menu" class="features-grid">
                    <button class="control-btn small" onclick="toggleRain()" title="Rose Rain">🌹</button>
                    <button class="control-btn small" onclick="toggleSnow()" title="Winter Mode">❄️</button>
                    <button class="control-btn small" onclick="toggleClouds()" title="Clouds">☁️</button>
                    <button class="control-btn small" onclick="launchFireworkManual()" title="Firework">🎆</button>
                    <button class="control-btn small" onclick="toggleAutoRotate()" title="Auto Rotate">🔄</button>
                    <button class="control-btn small" onclick="toggleFog()" title="Mist">🌫️</button>
                    <button class="control-btn small" onclick="changeLightColor()" title="Disco Lights">💡</button>
                    <button class="control-btn small" onclick="spawnBirds()" title="Birds">🕊️</button>
                    <button class="control-btn small" onclick="toggleRainbow()" title="Rainbow">🌈</button>
                </div>
            </div>
        </div>

        <!-- Hint -->
        <div id="interaction-hint">Tap the Door, Mailbox, or Ground...</div>
        
        <!-- Main Content Card -->
        <div id="content-card" role="dialog" aria-modal="true" aria-hidden="true">
            <h1 id="card-title">Welcome</h1>
            <div id="card-body" class="lyric-text" tabindex="0">...</div>

            <div class="card-controls">
                <button class="icon-btn" onclick="prevLyric()" aria-label="Previous lyric">◀</button>
                <button class="icon-btn" id="btn-tts-toggle" onclick="toggleTTS()" aria-pressed="false">🔊</button>
                <button class="icon-btn" onclick="nextLyric()" aria-label="Next lyric">▶</button>
                <select id="voice-select" class="small-select" aria-label="Select voice"></select>
            </div>

            <div style="margin-top:10px; display:flex; gap:8px; justify-content:center; align-items:center;">
                <input id="recipient-input" class="small-select" placeholder="Edit recipient name" aria-label="Edit recipient" />
                <button class="icon-btn" onclick="saveRecipient()" aria-label="Save recipient">Save</button>
            </div>

            <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
                <button class="action-btn" onclick="closeCard()">Close</button>
            </div>
        </div>

        <!-- Attribution -->
        <div class="attribution">
            <small>For <b>Kyal Sin Htet</b></small>
            <small>From</small>
            <strong>Stephan Filip</strong>
        </div>
    </div>

    <!-- Hidden Audio -->
    <audio id="bg-music" loop>
        <source src="" type="audio/mp3">
    </audio>

    <!-- Color picker for neon sign (hidden) -->
    <input id="neon-color-picker" type="color" value="#ff6fb5" style="position:fixed;left:-9999px;top:auto;" aria-hidden="true">

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            colors: {
                nightBg: 0x0a0510,
                dayBg: 0x87CEEB,
                houseWall: 0xffe4e1,
                roof: 0xdb7093,
                door: 0x8b4513,
                grass: 0x1a2b1a,
                snow: 0xffffff,
                path: 0x555555
            },
            names: {
                recipient: "Kyal Sin Htet",
                sender: "Stephan Filip"
            }
        };

        const LYRICS = [
            "You’re the light that shines in the night, LJ",
            "Every time I see you, feels like a holiday",
            "Got that smile that lights up the whole street",
            "Heart racing near you, baby, it’s on repeat",
            "Calling your name like a song on replay",
            "Everything you do just feels like fate today",
            "Your laugh lifts me, it takes me so high",
            "There’s no one like you, girl, you make me fly",
            "With you, I’m high, I’m in the clouds",
            "Dreaming ‘bout us, no doubts allowed",
            "In your eyes, I see the stars in line",
            "You’re my peace, my queen, my sunshine"
        ];

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, controls;
        let houseGroup, doorGroup, doorMesh, mailboxMesh, grassMesh;
        let raycaster, mouse;
        let clock = new THREE.Clock();
        
        // Systems
        let roseParticles = [], fireflies = [], snowParticles = [], smokeParticles = [], clouds = [], birds = [], fireworks = [];
        let lanterns = [], flowers = [];

        // New globals
        let signMesh = null;
        let autoFireworksInterval = null;
        let lightBulb = null;
        let starsGroup = null;
        let pathLights = [];
        let moonMesh = null;
        let moonLight = null;
        let moonPhase = 0;
        let photoModeActive = false;
        let danceGroup = null;
        let windStrength = 0.02;
        let signPulseInterval = null;
        let neonBoardMesh = null;
        let filipSignMesh = null;
        let mistGroup = [];
        let candleLights = [];
        
        // State
        let isNight = true;
        let isRainingRoses = false;
        let isSnowing = false;
        let isAutoRotate = false;
        let isCloudy = false;
        let isWinter = false;
        let isRainbow = false;
        let rainbowMesh;
        
        // Audio/TTS
        let synth = window.speechSynthesis;
        let currentLineIndex = 0;
        let isPlaying = false;

        // --- INIT ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.nightBg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.nightBg, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 90);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimise for mobile
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;
            controls.minDistance = 20;
            controls.maxDistance = 150;
            controls.autoRotate = false;
            controls.autoRotateSpeed = 1.0;

            // Lighting
            setupLights();

            // Objects
            createGroundAndPath();
            createHeartHouse();
            createEnvironment(); 
            createChimney();
            createFireflies();
            createFlowers();
            createLightBulb();
            createNeonBoard(CONFIG.names.recipient, 0, 26, 18);
            createFilipSign('Filip', -28, 18, 10);
            createCandleLights();
            spawnStars();
            addWindowFrames();

            // Interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
            
            // Touch Support
            const canvas = renderer.domElement;
            canvas.addEventListener('touchstart', onTouchStart, { passive: false });

            // Remove Loader
            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 1000);

            // Determine local time and set initial day/night state
            const hour = new Date().getHours();
            // Night if before 7am or after 6pm
            isNight = (hour < 7 || hour >= 18);
            // load any saved scene state (recipient, toggles)
            loadSceneState();
            applyDayNightState();

            // populate TTS voices (some browsers fire onvoiceschanged)
            populateVoices();

            animate();
        }

        // --- 3D CONSTRUCTION ---

        function setupLights() {
            const ambient = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xaaccff, 0.5);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024; // Lower res for mobile perf
            dirLight.shadow.mapSize.height = 1024;
            dirLight.name = "MainLight";
            scene.add(dirLight);

            const pointLight = new THREE.PointLight(0xffaa00, 1, 40);
            pointLight.position.set(0, 15, 15);
            pointLight.castShadow = true;
            pointLight.name = "PorchLight";
            scene.add(pointLight);
        }

        function createGroundAndPath() {
            const planeGeo = new THREE.PlaneGeometry(500, 500);
            const planeMat = new THREE.MeshStandardMaterial({ 
                color: CONFIG.colors.grass, 
                roughness: 1,
                side: THREE.DoubleSide
            });
            grassMesh = new THREE.Mesh(planeGeo, planeMat);
            grassMesh.rotation.x = -Math.PI / 2;
            grassMesh.receiveShadow = true;
            grassMesh.userData = { isInteractable: true, type: 'ground' };
            scene.add(grassMesh);

            const pathGeo = new THREE.PlaneGeometry(12, 80);
            const pathMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.path, roughness: 0.8 });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.set(0, 0.1, 50);
            path.receiveShadow = true;
            scene.add(path);

            // Path Lights
            for(let z=20; z<80; z+=15) {
                const l1 = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xffffaa}));
                l1.position.set(-7, 0.5, z);
                scene.add(l1);
                const l2 = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xffffaa}));
                l2.position.set(7, 0.5, z);
                scene.add(l2);
            }
        }

        function createHeartHouse() {
            houseGroup = new THREE.Group();

            // Walls
            const walls = new THREE.Mesh(
                new THREE.BoxGeometry(30, 25, 25),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.houseWall })
            );
            walls.position.y = 12.5;
            walls.castShadow = true;
            walls.receiveShadow = true;
            houseGroup.add(walls);

            // Roof
            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(24, 15, 4),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.roof })
            );
            roof.position.y = 32.5;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            houseGroup.add(roof);

            // Sign (we'll hide the original house sign in favor of the neon board)
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            function drawSignText(text, color = '#3e2723') {
                ctx.clearRect(0,0,512,128);
                ctx.fillStyle = "rgba(0,0,0,0)"; ctx.fillRect(0,0,512,128);
                ctx.font = 'bold 46px "Playfair Display"';
                ctx.fillStyle = color;
                ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(text, 256, 64);
            }
            drawSignText(CONFIG.names.recipient + ' LJ');
            const signTex = new THREE.CanvasTexture(canvas);
            signMesh = new THREE.Mesh(
                new THREE.BoxGeometry(18, 4, 1),
                new THREE.MeshStandardMaterial({ map: signTex, color: 0xffffff, emissive: 0x000000, emissiveIntensity: 0 })
            );
            signMesh.position.set(0, 22, 13);
            signMesh.userData = { canvas, ctx, drawSignText };
            // hide the legacy sign; we'll use the neon board instead
            signMesh.visible = false;
            houseGroup.add(signMesh);

            // Door Group
            doorGroup = new THREE.Group();
            doorGroup.position.set(-5, 0, 12.6);
            
            // Improved door: wood-like material with panels and knob
            doorMesh = new THREE.Mesh(
                new THREE.BoxGeometry(10, 18, 1),
                new THREE.MeshStandardMaterial({ color: CONFIG.colors.door, roughness:0.65, metalness:0.05 })
            );
            doorMesh.position.set(5, 9, 0);
            doorMesh.castShadow = true;
            doorMesh.userData = { isInteractable: true, type: 'door' };
            // add panel decorations
            const panelMat = new THREE.MeshStandardMaterial({ color: 0x7a3d2a, roughness:0.7 });
            const p1 = new THREE.Mesh(new THREE.BoxGeometry(8.2,4.0,0.6), panelMat); p1.position.set(5,13.5,0.51); doorGroup.add(p1);
            const p2 = new THREE.Mesh(new THREE.BoxGeometry(8.2,4.0,0.6), panelMat); p2.position.set(5,7,0.51); doorGroup.add(p2);
            const p3 = new THREE.Mesh(new THREE.BoxGeometry(8.2,7.0,0.6), panelMat); p3.position.set(5,3.5,0.51); doorGroup.add(p3);
            // knob (shiny)
            const knob = new THREE.Mesh(new THREE.SphereGeometry(0.8), new THREE.MeshStandardMaterial({ color: 0xffd700, metalness:0.9, roughness:0.15 }));
            knob.position.set(8, 9, 0.6); doorGroup.add(knob);
            doorGroup.add(doorMesh);

            // Heart Decor
            const heartShape = new THREE.Shape();
            heartShape.moveTo(25, 25);
            heartShape.bezierCurveTo(25, 25, 20, 0, 0, 0);
            heartShape.bezierCurveTo(-30, 0, -30, 35, -30, 35);
            heartShape.bezierCurveTo(-30, 55, -10, 77, 25, 95);
            heartShape.bezierCurveTo(60, 77, 80, 55, 80, 35);
            heartShape.bezierCurveTo(80, 35, 80, 0, 50, 0);
            heartShape.bezierCurveTo(35, 0, 25, 25, 25, 25);
            
            const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 5, bevelEnabled: false });
            const heartMat = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
            const doorHeart = new THREE.Mesh(heartGeo, heartMat);
            doorHeart.scale.set(0.04, -0.04, 0.04);
            doorHeart.position.set(5, 14, 0.6);
            doorMesh.add(doorHeart);

            houseGroup.add(doorGroup);
            
            // Windows
            createWindow(-8, 15, 12.6);
            createWindow(8, 15, 12.6);

            scene.add(houseGroup);
        }

        function createWindow(x, y, z) {
            // Frame
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(6.2, 6.2, 0.6),
                new THREE.MeshStandardMaterial({ color: 0x332211 })
            );
            frame.position.set(x, y, z);
            houseGroup.add(frame);

            // Glass (multi-pane)
            const glassMat = new THREE.MeshStandardMaterial({ color: 0xffffcc, transparent: true, opacity: 0.9, metalness:0.1, roughness:0.2 });
            const glass = new THREE.Mesh(new THREE.BoxGeometry(5,5,0.4), glassMat);
            glass.position.set(x, y, z+0.1);
            glass.userData = { isInteractable: true, type: 'window' };
            houseGroup.add(glass);

            // Cross pane divider
            const vert = new THREE.Mesh(new THREE.BoxGeometry(0.2,5,0.2), new THREE.MeshStandardMaterial({ color:0x443333 }));
            vert.position.set(x, y, z+0.2); houseGroup.add(vert);
            const hor = new THREE.Mesh(new THREE.BoxGeometry(5,0.2,0.2), new THREE.MeshStandardMaterial({ color:0x443333 }));
            hor.position.set(x, y, z+0.2); houseGroup.add(hor);

            // Shutters

        // --- Neon / Name Boards ---
        function createNeonBoard(text, x=0, y=20, z=10) {
            if(neonBoardMesh) return;
            const canvas = document.createElement('canvas'); canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.font = 'bold 96px "Great Vibes", cursive';
            ctx.textAlign = 'center'; ctx.textBaseline='middle';
            // neon gradient
            const grad = ctx.createLinearGradient(0,0,canvas.width,0);
            grad.addColorStop(0,'#ff6fb5'); grad.addColorStop(1,'#ffd36b');
            ctx.fillStyle = grad; ctx.fillText(text, canvas.width/2, canvas.height/2);

            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshStandardMaterial({ map: tex, emissive: 0xff88cc, emissiveIntensity: 1.2, metalness: 0.1 });
            const board = new THREE.Mesh(new THREE.PlaneGeometry(18,4), mat);
            board.position.set(x,y,z); board.rotation.y = 0; board.renderOrder = 999;
            board.userData = { isNeon:true };
            // make interactive: allow color changing
            board.userData.isInteractable = true; board.userData.type = 'neonboard';
            neonBoardMesh = board; scene.add(board);
            // subtle halo
            const halo = new THREE.Mesh(new THREE.PlaneGeometry(22,6), new THREE.MeshBasicMaterial({ color:0xff88cc, transparent:true, opacity:0.06 }));
            halo.position.set(x,y-0.6,z-0.1); scene.add(halo);
        }

        function changeNeonColorCycle() {
            if(!neonBoardMesh) return;
            const palette = ['#ff6fb5','#ffd36b','#6be1ff','#9bff88','#ff8ac1','#c78aff','#ffffff'];
            const cur = neonBoardMesh.material.emissive.getHexString ? '#'+neonBoardMesh.material.emissive.getHexString() : '#ff6fb5';
            let idx = palette.findIndex(c => c.toLowerCase() === cur.toLowerCase()); if(idx < 0) idx = 0; idx = (idx+1) % palette.length;
            applyNeonColor(palette[idx]);
        }

        function openNeonColorPicker() {
            const input = document.getElementById('neon-color-picker');
            if(input) input.click();
        }

        function applyNeonColor(hex) {
            if(!neonBoardMesh) return;
            // update emissive color
            try { neonBoardMesh.material.emissive.set(hex); } catch(e) {}
            // redraw canvas text in that color
            const map = neonBoardMesh.material.map;
            const c = document.createElement('canvas'); c.width = 1024; c.height = 256;
            const ctx = c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height);
            ctx.font = 'bold 96px "Great Vibes", cursive'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillStyle = hex; ctx.fillText(CONFIG.names.recipient, c.width/2, c.height/2);
            map.image = c; map.needsUpdate = true;
        }

                function coupleDance() {
                    if(danceGroup) { scene.remove(danceGroup); danceGroup = null; return; }
                    danceGroup = new THREE.Group();
                    const a = new THREE.Mesh(new THREE.BoxGeometry(1.2,2,0.6), new THREE.MeshStandardMaterial({ color: 0xffc0cb }));
                    const b = new THREE.Mesh(new THREE.BoxGeometry(1.2,2,0.6), new THREE.MeshStandardMaterial({ color: 0x88ccff }));
                    a.position.set(-3,1,25); b.position.set(3,1,25);
                    danceGroup.add(a); danceGroup.add(b); scene.add(danceGroup);
                    let t = 0;
                    const id = setInterval(()=>{
                        t += 0.05;
                        a.position.x = -3 + Math.sin(t)*0.6; a.rotation.y = Math.sin(t)*0.2;
                        b.position.x = 3 + Math.sin(t+Math.PI)*0.6; b.rotation.y = Math.sin(t+Math.PI)*0.2;
                    }, 30);
                    // stop after 18s
                    setTimeout(()=>{ clearInterval(id); if(danceGroup){ scene.remove(danceGroup); danceGroup = null; } }, 18000);
                }

                // Ambient color fade between two random tints
                function ambientColorFade(duration = 4000) {
                    const start = new THREE.Color(scene.background.getHex());
                    const end = new THREE.Color(Math.random()*0xffffff);
                    const t0 = Date.now();
                    const tick = ()=>{
                        const a = (Date.now() - t0)/duration;
                        if(a >= 1) { scene.background = end; return; }
                        scene.background = start.clone().lerp(end, a);
                        requestAnimationFrame(tick);
                    };
                    tick();
                }

                    if(currentLineIndex > 0) { currentLineIndex--; updateCardLine(); }
                }
                function nextLyric() {
                    if(currentLineIndex < LYRICS.length - 1) { currentLineIndex++; updateCardLine(); }
                }

                function updateCardLine() {
                    const display = document.getElementById('card-body');
                    display.innerText = LYRICS[currentLineIndex] || '';
                    // speak if TTS active
                    const tbtn = document.getElementById('btn-tts-toggle');
                    if(tbtn && tbtn.getAttribute('aria-pressed') === 'true') {
                        try { 
                            synth.cancel();
                            const u = new SpeechSynthesisUtterance(LYRICS[currentLineIndex]);
                            const sel = document.getElementById('voice-select');
                            if(sel && sel.value) u.voice = synth.getVoices().find(v => v.name === sel.value) || null;
                            u.onerror = (e) => { console.warn('TTS error:', e); };
                            synth.speak(u);
                        } catch(e) { console.warn('TTS failed:', e); }
                    }
                }

                function toggleTTS() {
                    const btn = document.getElementById('btn-tts-toggle');
                    const on = btn.getAttribute('aria-pressed') === 'true';
                    if(on) { btn.setAttribute('aria-pressed','false'); synth.cancel(); }
                    else { btn.setAttribute('aria-pressed','true'); updateCardLine(); }
                }

                function populateVoices() {
                    const sel = document.getElementById('voice-select');
                    if(!sel || !synth) return;
                    const voices = synth.getVoices();
                    sel.innerHTML = '';
                    voices.forEach(v=>{ const o = document.createElement('option'); o.value = v.name; o.innerText = v.name; sel.appendChild(o); });
                    if(voices.length > 0) sel.value = voices[0].name;
                }

                function saveRecipient() {
                    const inp = document.getElementById('recipient-input');
                    if(!inp) return;
                    const val = inp.value.trim();
                    if(val.length > 0) {
                        CONFIG.names.recipient = val;
                        setSignText(val + ' LJ');
                        saveSceneState();
                        inp.value = '';
                        showCard('Saved!');
                        setTimeout(()=>{ closeCard(); }, 900);
                    }
                }

                // Keyboard shortcuts
                window.addEventListener('keydown', (e)=>{
                    if(e.key === ' ' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); togglePlay(); }
                    if(e.key === 'ArrowLeft') prevLyric();
                    if(e.key === 'ArrowRight') nextLyric();
                    if(e.key.toLowerCase() === 'f') toggleFullscreen();
                    if(e.key.toLowerCase() === 'p') photoMode();
                });

                // Ensure voices populate when they become available
                window.speechSynthesis.onvoiceschanged = populateVoices;

                // Neon color picker hook
                document.addEventListener('DOMContentLoaded', ()=>{
                    const pick = document.getElementById('neon-color-picker');
                    if(pick) pick.addEventListener('input', (e)=>{ applyNeonColor(e.target.value); });
                });

                // Global error handlers (show overlay with message)
                window.addEventListener('error', (ev) => {
                    const m = document.getElementById('debug-msg');
                    if(m) { m.innerText = `${ev.message}\n at ${ev.filename}:${ev.lineno}:${ev.colno}`; document.getElementById('debug-overlay').style.display = 'block'; }
                    console.error(ev.error || ev.message);
                });
                window.addEventListener('unhandledrejection', (ev)=>{
                    const m = document.getElementById('debug-msg');
                    if(m) { m.innerText = `Unhandled Promise Rejection:\n${ev.reason}`; document.getElementById('debug-overlay').style.display = 'block'; }
                    console.error('Unhandled rejection', ev.reason);
                });

                // Double-click on canvas: open neon color picker when neon board double-clicked
                window.addEventListener('dblclick', ()=>{
                    try {
                        raycaster.setFromCamera(mouse, camera);
                        const ints = raycaster.intersectObjects(scene.children, true);
                        if(ints.length > 0) {
                            let obj = ints[0].object;
                            while(obj) {
                                if(obj.userData && obj.userData.type === 'neonboard') { openNeonColorPicker(); break; }
                                obj = obj.parent;
                            }
                        }
                    } catch(e) { console.warn('dblclick handler error', e); }
                });

        function spawnFloatingHeart(x, z) {
            const shape = new THREE.Shape();
            const width = 1, height = 1;
            shape.moveTo(0,0);
            shape.bezierCurveTo(width/2, height/2, width, 0, width, -height/2);
            shape.bezierCurveTo(width, -height, width/2, -height*1.5, 0, -height*2);
            shape.bezierCurveTo(-width/2, -height*1.5, -width, -height, -width, -height/2);
            shape.bezierCurveTo(-width, 0, -width/2, height/2, 0, 0);

            const geo = new THREE.ShapeGeometry(shape);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff69b4, side: THREE.DoubleSide });
            const heart = new THREE.Mesh(geo, mat);
            heart.position.set(x, 1, z);
            heart.rotation.x = Math.PI; // Flip upright
            heart.scale.set(0.5, 0.5, 0.5);
            scene.add(heart);
            
            // Reuse roseParticles logic for rising effect
            roseParticles.push(heart); 
        }

        // --- INTERACTION & LOGIC ---

        function onTouchStart(event) {
            event.preventDefault(); // Prevent scrolling
            // Use the first touch
            mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
            
            // Check interaction directly on touch start
            checkIntersection(true);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            checkIntersection(false);
        }

        function onMouseClick() {
            checkIntersection(true);
        }

        function checkIntersection(isClick) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            let foundInteractable = false;

            if (intersects.length > 0) {
                // Find first interactable parent
                let obj = intersects[0].object;
                let interactable = null;
                
                // Traverse up
                while(obj) {
                    if (obj.userData && obj.userData.isInteractable) {
                        interactable = obj;
                        break;
                    }
                    obj = obj.parent;
                }

                if (interactable) {
                    foundInteractable = true;
                    document.body.style.cursor = 'pointer';
                    
                    if (isClick) {
                        handleInteraction(interactable.userData.type, interactable, intersects[0].point);
                    } else if (interactable.material && interactable.material.emissive) {
                        // Hover glow
                        interactable.material.emissive.setHex(0x333333);
                    }
                } else if (isClick && intersects[0].object === grassMesh) {
                    // Click on ground spawns heart
                    spawnFloatingHeart(intersects[0].point.x, intersects[0].point.z);
                }
            }

            if (!foundInteractable) {
                document.body.style.cursor = 'grab';
                scene.traverse(child => {
                    if (child.material && child.material.emissive) child.material.emissive.setHex(0x000000);
                });
            }
        }

        function handleInteraction(type, object, point) {
            if (type === 'door') openDoorAndPlay();
            else if (type === 'mailbox') showLoveLetter();
            else if (type === 'lantern') toggleLantern(object);
            else if (type === 'window') toggleWindowLight(object);
            else if (type === 'neonboard') handleNeonClick();
        }

            const targetRot = -Math.PI / 1.5;

                alpha += 0.05;
                doorGroup.rotation.y = THREE.MathUtils.lerp(0, targetRot, alpha);
                if(alpha >= 1) clearInterval(i);
            }, 16);

            // Camera Zoom
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(0, 15, 35);
            let cA = 0;
            const cI = setInterval(() => {
                cA += 0.02;
                camera.position.lerpVectors(startPos, endPos, cA);
                if(cA >= 1) clearInterval(cI);
            }, 16);

            showCard("For My Sunshine");
            document.getElementById('interaction-hint').style.opacity = 0;
            startSong();

            const mainLight = scene.getObjectByName("MainLight");

            const porch = scene.getObjectByName("PorchLight");

            lanterns.forEach(l => l.intensity = isNight ? 0.8 : 0.0);

            // Fireflies only at night
            fireflies.forEach(f => f.visible = isNight);

            // Sign glow: find sign mesh (we created it in createHeartHouse)
            scene.traverse(o => {
                if(o.isMesh && o.geometry && o.geometry.parameters && o.geometry.parameters.width === 18) {

        // --- ANIMATION LOOP ---

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            controls.update();

            // Fireflies
            if(isNight && fireflies.length > 0) {
                const pos = fireflies[0].geometry.attributes.position.array;
                for(let i=0; i<pos.length; i+=3) {
                    pos[i+1] += Math.sin(Date.now()*0.001 + pos[i])*0.05;
                }
                fireflies[0].geometry.attributes.position.needsUpdate = true;
            }

            // Smoke
            spawnSmoke();
            for(let i=smokeParticles.length-1; i>=0; i--) {
                const p = smokeParticles[i];
                p.position.y += 0.1;
                p.material.opacity -= 0.01;
                if(p.material.opacity <= 0) { scene.remove(p); smokeParticles.splice(i,1); }
            }

            // Rain/Hearts rising
            if(isRainingRoses) {
               if(Math.random()>0.8) {
                    const geo = new THREE.PlaneGeometry(0.5, 0.5);
                    const mat = new THREE.MeshBasicMaterial({color: 0xff007f, side:THREE.DoubleSide});
                    const p = new THREE.Mesh(geo, mat);
                    p.position.set((Math.random()-0.5)*100, 100, (Math.random()-0.5)*100);
                    scene.add(p);
                    roseParticles.push(p);
               }
            }

            // Handle particles (Rose/Hearts/Snow)
            for(let i=roseParticles.length-1; i>=0; i--) {
                const p = roseParticles[i];
                if(p.geometry.type === 'ShapeGeometry') { // Rising Hearts
                    p.position.y += 0.1;
                    p.material.opacity -= 0.005;
                    if(p.position.y > 20) { scene.remove(p); roseParticles.splice(i,1); }
                } else { // Falling Roses
                    p.position.y -= 0.2; p.rotation.x += 0.05;
                    if(p.position.y < 0) { scene.remove(p); roseParticles.splice(i,1); }
                }
            }

            if(isSnowing) {
                if(Math.random()>0.5) spawnSnow();
                for(let i=snowParticles.length-1; i>=0; i--) {
                    const p = snowParticles[i];
                    p.position.y -= 0.1; p.position.x += Math.sin(Date.now()*0.001)*0.02;
                    if(p.position.y < 0) { scene.remove(p); snowParticles.splice(i,1); }
                }
            }

            // Birds
            // Birds: flock movement + wing flap
            birds.forEach(b => {
                // b can be Group (new) or old-style object
                if(b.mesh) {
                    b.mesh.position.x += b.speed;
                    b.mesh.position.y += Math.sin(Date.now()*0.002)*0.05;
                    if(b.mesh.position.x > 100) b.mesh.position.x = -100;
                } else {
                    // Group style
                    const vel = b.userData.vel;
                    b.position.add(vel);
                    // gentle sine bob
                    b.position.y += Math.sin(Date.now()*0.002 + (b.userData.phase||0))*0.02;
                    // wrap
                    if(b.position.x > 120) b.position.x = -120;
                    // flap wings
                    const t = Date.now()*0.002 * b.userData.flapSpeed*30;
                    const a = Math.sin(t) * 0.8;
                    b.userData.wingL.rotation.z = 0.2 + a;
                    b.userData.wingR.rotation.z = -0.2 - a;
                }
            });

            // Candle flicker
            if(candleLights.length > 0) {
                const now = Date.now()*0.002;
                candleLights.forEach((c, i) => {
                    const v = 0.6 + Math.abs(Math.sin(now*2 + c.phase))*0.4 + (Math.random()*0.03);
                    c.light.intensity = v;
                    c.flame.position.y = c.baseY + Math.sin(now*5 + c.phase)*0.02;
                });
            }

            // Clouds
            clouds.forEach(c => {
                c.position.x += 0.02;
                if(c.position.x > 150) c.position.x = -150;
            });

            // Fireworks
            for(let i=fireworks.length-1; i>=0; i--) {
                const fw = fireworks[i];
                fw.mesh.position.add(fw.vel);
                fw.vel.y -= 0.02; // Gravity
                fw.life -= 0.02;
                fw.mesh.material.opacity = fw.life;
                if(fw.life <= 0) { scene.remove(fw.mesh); fireworks.splice(i,1); }
            }

            // Flowers sway
            flowers.forEach((f, idx) => {
                f.rotation.z = Math.sin(Date.now()*0.002 + idx)*0.1 * (1 + windStrength*10);
            });

            // Dancers update (if present) - gently bob
            if(danceGroup) {
                danceGroup.children.forEach((c, i) => {
                    c.position.y = 1 + Math.sin(Date.now()*0.002 + i)*0.12;
                });
            }

            renderer.render(scene, camera);
        }

        // --- AUDIO ---

        function startSong() {
            isPlaying = true;
            currentLineIndex = 0;
            try { speakNextLine(); } catch(e) { console.warn('startSong error:', e); }
        }

        function stopExperience() {
            synth.cancel();
            isPlaying = false;
        }

        function speakNextLine() {
            if (!isPlaying || currentLineIndex >= LYRICS.length) return;

            const text = LYRICS[currentLineIndex];
            const display = document.getElementById('card-body');
            display.style.opacity = 0;
            
            setTimeout(() => {
                display.innerText = text;
                display.style.opacity = 1;
            }, 300);

            try {
                const u = new SpeechSynthesisUtterance(text);
                u.pitch = 1; u.rate = 0.9; u.volume = 1;
                const voices = synth.getVoices();
                const v = voices.find(v => v.name.includes("Google US English") || v.name.includes("Samantha"));
                if(v) u.voice = v;

                u.onend = () => {
                    currentLineIndex++;
                    if(isPlaying) setTimeout(speakNextLine, 800);
                };
                u.onerror = (e) => { console.warn('TTS onend error:', e); };

                synth.speak(u);
            } catch(e) { console.warn('speakNextLine error:', e); }
        }

        // Init
        window.onload = init;

    </script>
    <!-- Debug overlay -->
    <div id="debug-overlay" style="position:fixed;left:12px;bottom:12px;background:rgba(0,0,0,0.7);color:#ffb6d5;padding:10px;border-radius:8px;z-index:9999;max-width:380px;font-family:monospace;display:none;">
        <strong>Error:</strong>
        <div id="debug-msg" style="margin-top:6px;white-space:pre-wrap;color:#ffdede;font-size:0.9rem;"></div>
        <button onclick="document.getElementById('debug-overlay').style.display='none'" style="margin-top:6px;padding:6px;border-radius:6px;background:#222;color:#fff;border:none;cursor:pointer;">Dismiss</button>
    </div>
</body>
</html>
