<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic AI Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* --- CSS Reset & Base --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505; /* Deep black/grey */
            color: white;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 3D Canvas Container --- */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay (Glassmorphism) --- */
        #ui-layer {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: opacity 0.5s ease;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.5rem;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(255, 107, 107, 0.3);
        }

        /* --- Lyrics Display --- */
        #lyrics-display {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .lyric-line {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.5);
            transition: all 0.5s ease;
            margin: 5px 0;
        }

        .lyric-line.active {
            font-size: 1.3rem;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
            transform: scale(1.05);
        }

        /* --- Controls --- */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.8);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        /* --- Audio Visualizer Placeholder (Visual only) --- */
        .visualizer {
            display: flex;
            justify-content: center;
            gap: 5px;
            height: 20px;
            margin-bottom: 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .visualizer.playing {
            opacity: 1;
        }
        .bar {
            width: 4px;
            background: #ff69b4;
            animation: bounce 1s infinite ease-in-out;
        }
        .bar:nth-child(2) { animation-delay: 0.1s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.3s; }
        .bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 100% { height: 5px; }
            50% { height: 20px; }
        }

        /* Helper to hide Elements */
        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- 3D Scene Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        
        <h1 id="title-text">You're My Sunshine</h1>
        
        <div id="lyrics-display">
            <p class="lyric-line active">Ready to start?</p>
            <p class="lyric-line">Press Play to begin...</p>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="startExperience()" id="playBtn">Play Song</button>
            <button class="btn-secondary" onclick="stopExperience()" id="stopBtn" style="display:none;">Stop</button>
        </div>
    </div>

    <!-- Hidden Audio Player for Backing Track (Optional) -->
    <!-- Replace 'your-romantic-sound.mp3' with a real file path if you have one -->
    <audio id="bg-music" loop>
        <source src="" type="audio/mp3">
    </audio>

    <script>
        // --- CONFIGURATION ---
        const lyrics = [
            "You’re the light that shines in the night, LJ",
            "Every time I see you, feels like a holiday",
            "Got that smile that lights up the whole street",
            "Heart racing near you, baby, it’s on repeat",
            "Calling your name like a song on replay",
            "Everything you do just feels like fate today",
            "Your laugh lifts me, it takes me so high",
            "There’s no one like you, girl, you make me fly",
            "With you, I’m high, I’m in the clouds",
            "Dreaming ‘bout us, no doubts allowed",
            "In your eyes, I see the stars in line",
            "You’re my peace, my queen, my sunshine"
        ];

        // --- THREE.JS SETUP (The 3D Heart) ---
        let scene, camera, renderer, particles, mouseX = 0, mouseY = 0;
        let windowHalfX = window.innerWidth / 2;
        let windowHalfY = window.innerHeight / 2;
        let heartPulse = 0;
        let isPlaying = false;

        function initThree() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            // Add some fog for depth
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 1000;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            createHeart();
            
            // Event Listeners
            document.addEventListener('mousemove', onDocumentMouseMove);
            window.addEventListener('resize', onWindowResize);
            
            animate();
        }

        // Procedural Heart Logic using Math
        function createHeart() {
            const xSize = 50, ySize = 50;
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];
            const colorObj = new THREE.Color();

            // Heart Formula
            for (let i = 0; i < 15000; i++) {
                // Random angle t in [0, 2*PI]
                const t = Math.random() * Math.PI * 2;
                // Random properties for volume
                const r = 20 * (1 - Math.pow(Math.random(), 3)); // distribution
                
                // Heart shape parametric equations
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                let z = 0;

                // Scale it up
                x *= 15;
                y *= 15;
                
                // Add thickness (volume)
                z = (Math.random() - 0.5) * 100;
                
                // Add some scatter
                x += (Math.random() - 0.5) * 10;
                y += (Math.random() - 0.5) * 10;
                z += (Math.random() - 0.5) * 50;

                vertices.push(x, y, z);

                // Colors: Shades of Pink/Red
                const hue = 0.9 + Math.random() * 0.1; // Red/Pink range
                colorObj.setHSL(hue, 1.0, 0.6);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 3,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function onWindowResize() {
            windowHalfX = window.innerWidth / 2;
            windowHalfY = window.innerHeight / 2;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onDocumentMouseMove(event) {
            mouseX = event.clientX - windowHalfX;
            mouseY = event.clientY - windowHalfY;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Interaction Rotation
            if (particles) {
                particles.rotation.x += 0.001;
                particles.rotation.y += 0.002;
                
                // Mouse interaction easing
                particles.rotation.x += (mouseY * 0.0001 - particles.rotation.x) * 0.05;
                particles.rotation.y += (mouseX * 0.0001 - particles.rotation.y) * 0.05;

                // Pulse Effect
                const time = Date.now() * 0.002;
                let scale = 1;
                
                if (isPlaying) {
                    // Strong heartbeat when playing
                    scale = 1 + Math.sin(time * 4) * 0.1; 
                } else {
                    // Gentle breathing when idle
                    scale = 1 + Math.sin(time) * 0.05;
                }
                
                particles.scale.set(scale, scale, scale);
            }

            renderer.render(scene, camera);
        }

        // --- AUDIO & LYRICS LOGIC ---
        
        let synth = window.speechSynthesis;
        let utterance = new SpeechSynthesisUtterance();
        let currentLineIndex = 0;

        function startExperience() {
            if (synth.speaking) return;

            isPlaying = true;
            document.getElementById('playBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('visualizer').classList.add('playing');
            
            // Try to play background music if source exists
            const bgMusic = document.getElementById('bg-music');
            if(bgMusic.getAttribute('src')) {
                bgMusic.volume = 0.3;
                bgMusic.play().catch(e => console.log("Audio file not found or blocked"));
            }

            currentLineIndex = 0;
            speakNextLine();
        }

        function stopExperience() {
            synth.cancel();
            isPlaying = false;
            document.getElementById('playBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('visualizer').classList.remove('playing');
            document.getElementById('bg-music').pause();
            
            // Reset UI
            const display = document.getElementById('lyrics-display');
            display.innerHTML = `
                <p class="lyric-line active">Experience Paused</p>
                <p class="lyric-line">Press Play to resume</p>
            `;
        }

        function speakNextLine() {
            if (currentLineIndex >= lyrics.length || !isPlaying) {
                stopExperience();
                return;
            }

            const text = lyrics[currentLineIndex];
            updateLyricsUI(currentLineIndex);

            // Create utterance for this specific line
            const u = new SpeechSynthesisUtterance(text);
            
            // Voice Settings
            u.pitch = 1.1; 
            u.rate = 0.85; // Slower is more romantic
            u.volume = 1;

            // Try to find a better voice (some browsers have premium voices)
            const voices = synth.getVoices();
            // Look for a female voice or a "Google US English" voice for better quality
            const preferredVoice = voices.find(v => v.name.includes('Google US English') || v.name.includes('Samantha'));
            if (preferredVoice) u.voice = preferredVoice;

            u.onend = () => {
                currentLineIndex++;
                // Small pause between lines
                setTimeout(speakNextLine, 500); 
            };

            synth.speak(u);
        }

        function updateLyricsUI(index) {
            const display = document.getElementById('lyrics-display');
            
            // Get current, previous, and next lines
            const current = lyrics[index];
            const next = lyrics[index + 1] || "...";
            
            // Update HTML with fade transition
            display.style.opacity = 0;
            
            setTimeout(() => {
                display.innerHTML = `
                    <p class="lyric-line active">${current}</p>
                    <p class="lyric-line" style="opacity: 0.6; font-size: 0.9rem;">${next}</p>
                `;
                display.style.opacity = 1;
            }, 300);
        }

        // Initialize 3D Scene immediately
        initThree();

        // Load voices (some browsers load them asynchronously)
        speechSynthesis.onvoiceschanged = () => {
            console.log("Voices loaded");
        };

    </script>
</body>
</html>
