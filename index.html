<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyal Sin Htet's Romantic Home</title>
    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for looking around -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Great+Vibes&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Reset & Base --- */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body {
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            height: 100vh;
            width: 100vw;
        }

        /* --- 3D Canvas --- */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* Top Controls */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
            padding: 20px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s;
            margin: 0 5px;
        }
        .control-btn:hover { background: rgba(255, 105, 180, 0.6); transform: scale(1.1); }

        /* The Lyrics/Main Card */
        #content-card {
            background: rgba(20, 10, 20, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 192, 203, 0.3);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 90%;
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            display: none; /* Hidden by default */
        }

        #content-card.visible {
            opacity: 1;
            display: block;
            transform: translate(-50%, -50%) scale(1);
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            background: linear-gradient(to right, #ff9a9e, #fecfef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            text-shadow: 0 2px 5px rgba(255,20,147,0.3);
        }

        .lyric-text {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            min-height: 3em;
            color: #fff0f5;
            margin: 15px 0;
            font-style: italic;
            line-height: 1.6;
        }

        /* Attribution */
        .attribution {
            position: absolute;
            bottom: 20px;
            right: 20px;
            text-align: right;
            pointer-events: auto;
            font-family: 'Playfair Display', serif;
        }
        .attribution small {
            display: block;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .attribution strong {
            color: #ff69b4;
            font-size: 1.1rem;
        }

        /* Instruction Tooltip */
        #interaction-hint {
            position: absolute;
            bottom: 15%;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 0.5s;
            animation: pulse 2s infinite;
        }

        /* Buttons */
        .action-btn {
            padding: 10px 25px;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: transform 0.2s;
        }
        .action-btn:hover { transform: translateY(-2px); }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* Loading Overlay */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff69b4;
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            transition: opacity 1s;
        }
    </style>
</head>
<body>

    <div id="loader">Building Love Square...</div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <!-- Top Controls -->
        <div class="top-bar">
            <div>
                <button class="control-btn" onclick="toggleDayNight()" title="Toggle Day/Night">☀/☾</button>
                <button class="control-btn" onclick="toggleRain()" title="Rose Rain">🌹</button>
            </div>
        </div>

        <!-- Hint -->
        <div id="interaction-hint">Explore the garden... Click the Door or Mailbox</div>
        
        <!-- Main Content Card (Lyrics or Letter) -->
        <div id="content-card">
            <h1 id="card-title">Welcome</h1>
            <div id="card-body" class="lyric-text">...</div>
            <button class="action-btn" onclick="closeCard()">Close</button>
        </div>

        <!-- Attribution -->
        <div class="attribution">
            <small>Specially crafted for <b>Kyal Sin Htet</b></small>
            <small>With all my love,</small>
            <strong>Stephan Filip</strong>
        </div>
    </div>

    <!-- Hidden Audio -->
    <audio id="bg-music" loop>
        <source src="" type="audio/mp3">
    </audio>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            colors: {
                nightBg: 0x0a0510,
                dayBg: 0x87CEEB,
                houseWall: 0xffe4e1,
                roof: 0xdb7093,
                door: 0x8b4513,
                grass: 0x1a2b1a,
                path: 0x555555
            },
            names: {
                recipient: "Kyal Sin Htet",
                sender: "Stephan Filip"
            }
        };

        const LYRICS = [
            "You’re the light that shines in the night, LJ",
            "Every time I see you, feels like a holiday",
            "Got that smile that lights up the whole street",
            "Heart racing near you, baby, it’s on repeat",
            "Calling your name like a song on replay",
            "Everything you do just feels like fate today",
            "Your laugh lifts me, it takes me so high",
            "There’s no one like you, girl, you make me fly",
            "With you, I’m high, I’m in the clouds",
            "Dreaming ‘bout us, no doubts allowed",
            "In your eyes, I see the stars in line",
            "You’re my peace, my queen, my sunshine"
        ];

        // --- GLOBAL VARIABLES ---
        let scene, camera, renderer, controls;
        let houseGroup, doorGroup, doorMesh, mailboxMesh;
        let raycaster, mouse;
        let particles, roseParticles = [];
        let fireflies = [];
        let isNight = true;
        let isRainingRoses = false;
        let lanterns = [];
        
        // Audio/TTS
        let synth = window.speechSynthesis;
        let currentLineIndex = 0;
        let isPlaying = false;
        let isReadingLetter = false;

        // --- INIT ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.nightBg);
            scene.fog = new THREE.FogExp2(CONFIG.colors.nightBg, 0.015);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 90);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
            controls.minDistance = 30;
            controls.maxDistance = 150;

            // Lighting
            setupLights();

            // Objects
            createGroundAndPath();
            createHeartHouse();
            createEnvironment(); // Trees, Mailbox, Lanterns
            createFireflies();

            // Interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
            // Touch support for mobile
            window.addEventListener('touchstart', (e) => {
                mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
                checkIntersection();
            });

            // Start Loop
            document.getElementById('loader').style.opacity = 0;
            setTimeout(() => document.getElementById('loader').remove(), 1000);
            animate();
        }

        // --- 3D CONSTRUCTION FUNCTIONS ---

        function setupLights() {
            // Ambient
            const ambient = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambient);

            // Moon/Sun Light
            const dirLight = new THREE.DirectionalLight(0xaaccff, 0.5);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.name = "MainLight";
            scene.add(dirLight);

            // Warm house glow
            const pointLight = new THREE.PointLight(0xffaa00, 1, 40);
            pointLight.position.set(0, 15, 15);
            pointLight.castShadow = true;
            scene.add(pointLight);
        }

        function createGroundAndPath() {
            // Grass
            const planeGeo = new THREE.PlaneGeometry(500, 500);
            const planeMat = new THREE.MeshStandardMaterial({ 
                color: CONFIG.colors.grass, 
                roughness: 1,
                side: THREE.DoubleSide
            });
            const ground = new THREE.Mesh(planeGeo, planeMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Cobblestone Path (Procedural Strip)
            const pathGeo = new THREE.PlaneGeometry(12, 80);
            const pathMat = new THREE.MeshStandardMaterial({ 
                color: 0x444444, 
                roughness: 0.8 
            });
            const path = new THREE.Mesh(pathGeo, pathMat);
            path.rotation.x = -Math.PI / 2;
            path.position.set(0, 0.1, 50); // Slightly above grass, leading to door
            path.receiveShadow = true;
            scene.add(path);
        }

        // Helper to create text texture
        function createTextTexture(text, bgColor = "rgba(0,0,0,0)", textColor = "#5d4037") {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.font = 'bold 50px "Playfair Display", serif';
            ctx.fillStyle = textColor;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            return new THREE.CanvasTexture(canvas);
        }

        function createHeartHouse() {
            houseGroup = new THREE.Group();

            // 1. Main Structure
            const wallsGeo = new THREE.BoxGeometry(30, 25, 25);
            const wallsMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.houseWall });
            const walls = new THREE.Mesh(wallsGeo, wallsMat);
            walls.position.y = 12.5;
            walls.castShadow = true;
            walls.receiveShadow = true;
            houseGroup.add(walls);

            // 2. Roof
            const roofGeo = new THREE.ConeGeometry(24, 15, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.roof });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 32.5;
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            houseGroup.add(roof);

            // 3. Name Sign (Kyal Sin Htet)
            const signGeo = new THREE.BoxGeometry(16, 4, 1);
            const signTex = createTextTexture(CONFIG.names.recipient, "#d2b48c", "#3e2723");
            const signMat = new THREE.MeshStandardMaterial({ map: signTex });
            const sign = new THREE.Mesh(signGeo, signMat);
            sign.position.set(0, 22, 13); // Above door
            houseGroup.add(sign);

            // 4. Door Group
            doorGroup = new THREE.Group();
            doorGroup.position.set(-5, 0, 12.6);
            
            const doorGeo = new THREE.BoxGeometry(10, 18, 1);
            const doorMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.door });
            doorMesh = new THREE.Mesh(doorGeo, doorMat);
            doorMesh.position.set(5, 9, 0);
            doorMesh.castShadow = true;
            doorMesh.userData = { isInteractable: true, type: 'door' };
            doorGroup.add(doorMesh);

            // Heart on Door
            const heartShape = new THREE.Shape();
            const x = 0, y = 0;
            heartShape.moveTo(x + 2.5, y + 2.5);
            heartShape.bezierCurveTo(x + 2.5, y + 2.5, x + 2.0, y, x, y);
            heartShape.bezierCurveTo(x - 3.0, y, x - 3.0, y + 3.5, x - 3.0, y + 3.5);
            heartShape.bezierCurveTo(x - 3.0, y + 5.5, x - 1.0, y + 7.7, x + 2.5, y + 9.5);
            heartShape.bezierCurveTo(x + 6.0, y + 7.7, x + 8.0, y + 5.5, x + 8.0, y + 3.5);
            heartShape.bezierCurveTo(x + 8.0, y + 3.5, x + 8.0, y, x + 5.0, y);
            heartShape.bezierCurveTo(x + 3.5, y, x + 2.5, y + 2.5, x + 2.5, y + 2.5);
            
            const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 0.5, bevelEnabled: false });
            const heartMat = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
            const doorHeart = new THREE.Mesh(heartGeo, heartMat);
            doorHeart.scale.set(0.4, -0.4, 0.4);
            doorHeart.position.set(3, 13, 0.6);
            doorMesh.add(doorHeart);

            // Knob
            const knob = new THREE.Mesh(
                new THREE.SphereGeometry(0.8),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 })
            );
            knob.position.set(8, 9, 0.6);
            doorMesh.add(knob);

            houseGroup.add(doorGroup);
            scene.add(houseGroup);
        }

        function createEnvironment() {
            // 1. Mailbox
            const postGeo = new THREE.CylinderGeometry(0.5, 0.5, 10);
            const postMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 });
            const post = new THREE.Mesh(postGeo, postMat);
            post.position.set(15, 5, 40);
            post.castShadow = true;
            scene.add(post);

            const boxGeo = new THREE.BoxGeometry(4, 3, 6);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
            mailboxMesh = new THREE.Mesh(boxGeo, boxMat);
            mailboxMesh.position.set(15, 10, 40);
            mailboxMesh.castShadow = true;
            mailboxMesh.userData = { isInteractable: true, type: 'mailbox' };
            scene.add(mailboxMesh);

            // 2. Lanterns
            const positions = [[-10, 30], [10, 30], [-10, 60], [10, 60]];
            positions.forEach(pos => {
                const lanternGroup = new THREE.Group();
                lanternGroup.position.set(pos[0], 0, pos[1]);
                
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.3, 8),
                    new THREE.MeshStandardMaterial({ color: 0x222222 })
                );
                pole.position.y = 4;
                lanternGroup.add(pole);

                const glass = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 3, 2),
                    new THREE.MeshBasicMaterial({ color: 0xffffaa, transparent: true, opacity: 0.8 })
                );
                glass.position.y = 8;
                glass.userData = { isInteractable: true, type: 'lantern' };
                lanternGroup.add(glass);

                // Point light inside lantern
                const light = new THREE.PointLight(0xffaa00, 0.8, 15);
                light.position.y = 8;
                lanternGroup.add(light);
                lanterns.push(light); // Store to animate later

                scene.add(lanternGroup);
            });

            // 3. Low Poly Trees
            for(let i=0; i<8; i++) {
                const tree = new THREE.Group();
                const trunk = new THREE.Mesh(
                    new THREE.CylinderGeometry(1, 1.5, 5),
                    new THREE.MeshStandardMaterial({ color: 0x5d4037 })
                );
                trunk.position.y = 2.5;
                trunk.castShadow = true;
                
                const leaves = new THREE.Mesh(
                    new THREE.ConeGeometry(6, 12, 8),
                    new THREE.MeshStandardMaterial({ color: 0x2d5a27 })
                );
                leaves.position.y = 8;
                leaves.castShadow = true;

                tree.add(trunk);
                tree.add(leaves);
                
                // Random position away from path
                const angle = Math.random() * Math.PI * 2;
                const radius = 40 + Math.random() * 60;
                tree.position.set(Math.cos(angle)*radius, 0, Math.sin(angle)*radius);
                // Keep front clear
                if (Math.abs(tree.position.x) < 15 && tree.position.z > 0) tree.position.x += 30;

                scene.add(tree);
            }
        }

        function createFireflies() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 100; i++) {
                vertices.push(
                    (Math.random() - 0.5) * 200,
                    Math.random() * 50,
                    (Math.random() - 0.5) * 200
                );
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: 0xffff00, size: 0.5, transparent: true });
            const points = new THREE.Points(geometry, material);
            scene.add(points);
            fireflies.push(points);
        }

        // --- INTERACTION LOGIC ---

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            checkIntersection();
        }

        function checkIntersection() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            let foundInteractable = false;
            if (intersects.length > 0) {
                // Find first interactable parent
                let obj = intersects[0].object;
                while(obj) {
                    if (obj.userData && obj.userData.isInteractable) {
                        foundInteractable = true;
                        document.body.style.cursor = 'pointer';
                        
                        // Simple highlight logic
                        if (obj.material && obj.material.emissive) {
                            obj.material.emissive.setHex(0x333333);
                        }
                        break;
                    }
                    obj = obj.parent;
                }
            }

            if (!foundInteractable) {
                document.body.style.cursor = 'grab';
                // Reset highlights (simplified)
                scene.traverse(child => {
                    if (child.material && child.material.emissive) child.material.emissive.setHex(0x000000);
                });
            }
        }

        function onMouseClick() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                // Traverse up to find user data
                while(obj) {
                    if (obj.userData && obj.userData.isInteractable) {
                        handleInteraction(obj.userData.type, obj);
                        return;
                    }
                    obj = obj.parent;
                }
            }
        }

        function handleInteraction(type, object) {
            if (type === 'door') {
                openDoorAndPlay();
            } else if (type === 'mailbox') {
                showLoveLetter();
            } else if (type === 'lantern') {
                // Change color just for fun
                object.parent.children.forEach(c => {
                    if(c.isPointLight) c.color.setHex(Math.random() * 0xffffff);
                });
            }
        }

        function openDoorAndPlay() {
            if(isPlaying) return;
            
            // Animation: Open Door
            const targetRot = -Math.PI / 1.5;
            let alpha = 0;
            const interval = setInterval(() => {
                alpha += 0.05;
                doorGroup.rotation.y = THREE.MathUtils.lerp(0, targetRot, alpha);
                if(alpha >= 1) clearInterval(interval);
            }, 16);

            // Zoom Camera
            const startPos = camera.position.clone();
            const endPos = new THREE.Vector3(0, 15, 40);
            let camAlpha = 0;
            const camInterval = setInterval(() => {
                camAlpha += 0.02;
                camera.position.lerpVectors(startPos, endPos, camAlpha);
                if (camAlpha >= 1) clearInterval(camInterval);
            }, 16);

            document.getElementById('content-card').classList.add('visible');
            document.getElementById('card-title').innerText = "For My Sunshine";
            document.getElementById('interaction-hint').style.opacity = 0;
            
            startSong();
        }

        function showLoveLetter() {
            if(isPlaying) return; // Focus on one thing
            
            document.getElementById('content-card').classList.add('visible');
            document.getElementById('card-title').innerText = "A Note for You";
            
            const letter = `
                "My Dearest ${CONFIG.names.recipient},<br><br>
                Every brick of this house represents a moment we've shared.<br>
                Every light represents the brightness you bring to my life.<br>
                This digital world is small, but my love for you is infinite.<br><br>
                Yours always,<br>${CONFIG.names.sender}"
            `;
            document.getElementById('card-body').innerHTML = letter;
            document.getElementById('card-body').style.fontSize = "1rem";
        }

        function closeCard() {
            document.getElementById('content-card').classList.remove('visible');
            stopExperience();
            
            // Close door animation
            doorGroup.rotation.y = 0; 
            
            // Reset Camera smoothly
            const endPos = new THREE.Vector3(0, 20, 90);
            let alpha = 0;
            const interval = setInterval(() => {
                alpha += 0.05;
                camera.position.lerp(endPos, 0.1);
                if(camera.position.distanceTo(endPos) < 1) clearInterval(interval);
            }, 20);

            document.getElementById('interaction-hint').style.opacity = 1;
        }

        // --- FEATURES ---

        function toggleDayNight() {
            isNight = !isNight;
            const bg = isNight ? CONFIG.colors.nightBg : CONFIG.colors.dayBg;
            scene.background.setHex(bg);
            scene.fog.color.setHex(bg);
            
            const mainLight = scene.getObjectByName("MainLight");
            if(mainLight) {
                mainLight.intensity = isNight ? 0.5 : 1.2;
                mainLight.color.setHex(isNight ? 0xaaccff : 0xffffee);
            }
            
            // Toggle Lanterns
            lanterns.forEach(l => l.intensity = isNight ? 0.8 : 0);
            // Toggle Fireflies
            fireflies[0].visible = isNight;
        }

        function toggleRain() {
            isRainingRoses = !isRainingRoses;
            if(!isRainingRoses) {
                roseParticles.forEach(p => scene.remove(p));
                roseParticles = [];
            }
        }

        function createRosePetal() {
            const geo = new THREE.PlaneGeometry(0.5, 0.5);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff007f, side: THREE.DoubleSide });
            const petal = new THREE.Mesh(geo, mat);
            
            petal.position.set(
                (Math.random() - 0.5) * 100,
                100,
                (Math.random() - 0.5) * 100
            );
            petal.rotation.set(Math.random(), Math.random(), Math.random());
            
            scene.add(petal);
            roseParticles.push(petal);
        }

        // --- ANIMATION LOOP ---

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Fireflies movement
            if(fireflies.length > 0 && isNight) {
                const positions = fireflies[0].geometry.attributes.position.array;
                for(let i=0; i<positions.length; i+=3) {
                    positions[i+1] += Math.sin(Date.now() * 0.001 + positions[i]) * 0.05;
                    positions[i] += Math.cos(Date.now() * 0.001 + positions[i+1]) * 0.02;
                }
                fireflies[0].geometry.attributes.position.needsUpdate = true;
            }

            // Rose Rain
            if(isRainingRoses) {
                if(Math.random() > 0.8) createRosePetal(); // Spawn rate
                
                for(let i = roseParticles.length - 1; i >= 0; i--) {
                    const p = roseParticles[i];
                    p.position.y -= 0.2;
                    p.rotation.x += 0.02;
                    p.rotation.y += 0.02;
                    
                    if(p.position.y < 0) {
                        scene.remove(p);
                        roseParticles.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- AUDIO/LYRICS ---

        function startSong() {
            isPlaying = true;
            currentLineIndex = 0;
            speakNextLine();
        }

        function stopExperience() {
            synth.cancel();
            isPlaying = false;
        }

        function speakNextLine() {
            if (!isPlaying || currentLineIndex >= LYRICS.length) return;

            const text = LYRICS[currentLineIndex];
            const display = document.getElementById('card-body');
            display.style.opacity = 0;
            
            setTimeout(() => {
                display.innerText = text;
                display.style.opacity = 1;
            }, 300);

            const u = new SpeechSynthesisUtterance(text);
            u.pitch = 1; 
            u.rate = 0.9;
            u.volume = 1;
            
            // Try to pick a nice voice
            const voices = synth.getVoices();
            const v = voices.find(v => v.name.includes("Google US English") || v.name.includes("Samantha"));
            if(v) u.voice = v;

            u.onend = () => {
                currentLineIndex++;
                if(isPlaying) setTimeout(speakNextLine, 800);
            };

            synth.speak(u);
        }

        // Init
        window.onload = init;

    </script>
</body>
</html>
