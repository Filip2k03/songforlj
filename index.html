<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Heart House</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        /* --- CSS Reset & Base --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #050505;
            color: white;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- 3D Canvas --- */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- UI Layer --- */
        #ui-layer {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to 3D scene */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* The Lyrics Card (Initially Hidden) */
        #lyrics-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            max-width: 500px;
            width: 90%;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s ease, transform 1s ease;
            pointer-events: auto; /* Enable buttons inside */
        }

        #lyrics-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Instruction Tooltip */
        #instruction {
            position: absolute;
            bottom: 20%;
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 10px #ff69b4;
            pointer-events: none;
            transition: opacity 0.5s;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .lyric-line {
            font-size: 1.2rem;
            min-height: 1.5em;
            color: rgba(255, 255, 255, 0.9);
            margin: 10px 0;
            transition: opacity 0.5s;
        }

        /* Reset Button */
        .reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.3s;
        }
        .reset-btn:hover { background: rgba(255, 255, 255, 0.2); }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="instruction">Knock on the door to enter...</div>
        
        <div id="lyrics-card">
            <h1 id="title-text">Welcome Home, My Sunshine</h1>
            <div id="lyrics-text" class="lyric-line">...</div>
            <button class="reset-btn" onclick="resetExperience()">Close Door</button>
        </div>
    </div>

    <!-- Hidden Audio for Backing Track -->
    <audio id="bg-music" loop>
        <!-- Place a valid mp3 URL here if you have one -->
        <source src="" type="audio/mp3">
    </audio>

    <script>
        // --- DATA ---
        const lyrics = [
            "You’re the light that shines in the night, LJ",
            "Every time I see you, feels like a holiday",
            "Got that smile that lights up the whole street",
            "Heart racing near you, baby, it’s on repeat",
            "Calling your name like a song on replay",
            "Everything you do just feels like fate today",
            "Your laugh lifts me, it takes me so high",
            "There’s no one like you, girl, you make me fly",
            "With you, I’m high, I’m in the clouds",
            "Dreaming ‘bout us, no doubts allowed",
            "In your eyes, I see the stars in line",
            "You’re my peace, my queen, my sunshine"
        ];

        // --- THREE.JS VARIABLES ---
        let scene, camera, renderer, particles;
        let houseGroup, doorGroup, doorMesh;
        let raycaster, mouse;
        let isDoorOpen = false;
        let isHoveringDoor = false;
        
        // --- AUDIO/TTS VARIABLES ---
        let synth = window.speechSynthesis;
        let currentLineIndex = 0;
        let isPlaying = false;

        function initThree() {
            const container = document.getElementById('canvas-container');
            
            // Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x1a0b1a, 0.005); // Dark purple fog
            scene.background = new THREE.Color(0x1a0b1a);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 80); // Look at house from front

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true; // Enable shadows
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff69b4, 1.5, 100);
            pointLight.position.set(20, 30, 20);
            pointLight.castShadow = true;
            scene.add(pointLight);
            
            // Create Objects
            createParticles();
            createHeartHouse();
            createGround();

            // Interaction
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('click', onMouseClick);
            
            animate();
        }

        function createHeartShape() {
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo(x + 2.5, y + 2.5);
            heartShape.bezierCurveTo(x + 2.5, y + 2.5, x + 2.0, y, x, y);
            heartShape.bezierCurveTo(x - 3.0, y, x - 3.0, y + 3.5, x - 3.0, y + 3.5);
            heartShape.bezierCurveTo(x - 3.0, y + 5.5, x - 1.0, y + 7.7, x + 2.5, y + 9.5);
            heartShape.bezierCurveTo(x + 6.0, y + 7.7, x + 8.0, y + 5.5, x + 8.0, y + 3.5);
            heartShape.bezierCurveTo(x + 8.0, y + 3.5, x + 8.0, y, x + 5.0, y);
            heartShape.bezierCurveTo(x + 3.5, y, x + 2.5, y + 2.5, x + 2.5, y + 2.5);
            return heartShape;
        }

        function createHeartHouse() {
            houseGroup = new THREE.Group();

            // 1. Walls
            const wallsGeo = new THREE.BoxGeometry(30, 25, 25);
            const wallsMat = new THREE.MeshStandardMaterial({ color: 0xffe4e1 }); // Misty Rose
            const walls = new THREE.Mesh(wallsGeo, wallsMat);
            walls.position.y = 12.5;
            walls.castShadow = true;
            walls.receiveShadow = true;
            houseGroup.add(walls);

            // 2. Roof (Pyramid)
            const roofGeo = new THREE.ConeGeometry(24, 15, 4); // 4 sides pyramid
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xdb7093 }); // Pale Violet Red
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 25 + 7.5;
            roof.rotation.y = Math.PI / 4; // Align flat side to front
            roof.castShadow = true;
            houseGroup.add(roof);

            // 3. Door System (Pivot Group)
            // Hinge is at x = -4, z = 12.6 (slightly in front of wall)
            doorGroup = new THREE.Group();
            doorGroup.position.set(-5, 0, 12.6); 
            
            // The actual door mesh
            const doorGeo = new THREE.BoxGeometry(10, 18, 1);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 }); // Saddle Brown
            doorMesh = new THREE.Mesh(doorGeo, doorMat);
            
            // Offset door mesh so its edge is at the pivot (0,0 of doorGroup)
            // Door width is 10, so center is at x=5 relative to pivot
            doorMesh.position.set(5, 9, 0); 
            doorMesh.castShadow = true;
            
            doorGroup.add(doorMesh);
            houseGroup.add(doorGroup);

            // 4. Heart Decoration on Door
            const heartShape = createHeartShape();
            const extrudeSettings = { depth: 0.5, bevelEnabled: false };
            const heartGeo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
            const heartMat = new THREE.MeshBasicMaterial({ color: 0xff69b4 }); // Hot Pink
            const doorHeart = new THREE.Mesh(heartGeo, heartMat);
            
            // Scale and Position heart on the door mesh
            doorHeart.scale.set(0.4, -0.4, 0.4); // Flip Y because shapes draw upwards
            doorHeart.position.set(3, 13, 0.6); // Position relative to door mesh center? No, relative to doorMesh coordinate space
            // Actually, adding to doorMesh is easier for rotation
            doorMesh.add(doorHeart);

            // 5. Doorknob
            const knobGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const knobMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
            const knob = new THREE.Mesh(knobGeo, knobMat);
            knob.position.set(8, 9, 0.6); // Right side of door
            doorMesh.add(knob);

            scene.add(houseGroup);
        }

        function createGround() {
            const geometry = new THREE.PlaneGeometry(500, 500);
            const material = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            const ground = new THREE.Mesh(geometry, material);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            ground.receiveShadow = true;
            scene.add(ground);
        }

        function createParticles() {
            // Create a cloud of hearts surrounding the house
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];
            const colorObj = new THREE.Color();

            for (let i = 0; i < 2000; i++) {
                // Random position in a sphere around the house
                const r = 40 + Math.random() * 40;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                const x = r * Math.sin(phi) * Math.cos(theta);
                const y = r * Math.sin(phi) * Math.sin(theta) + 20; // Lift up slightly
                const z = r * Math.cos(phi);

                vertices.push(x, y, z);

                // Pink/Purple colors
                const hue = 0.8 + Math.random() * 0.2; 
                colorObj.setHSL(hue, 0.8, 0.6);
                colors.push(colorObj.r, colorObj.g, colorObj.b);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        // --- INTERACTION LOGIC ---

        function onMouseMove(event) {
            // Normalize mouse coords (-1 to +1)
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            checkIntersection();
        }

        function onMouseClick(event) {
            if (isHoveringDoor && !isDoorOpen) {
                openDoor();
            }
        }

        function checkIntersection() {
            raycaster.setFromCamera(mouse, camera);
            // Check intersection with doorMesh specifically
            const intersects = raycaster.intersectObject(doorMesh);

            if (intersects.length > 0) {
                isHoveringDoor = true;
                document.body.style.cursor = 'pointer';
                // Highlight door
                doorMesh.material.emissive.setHex(0x331111);
            } else {
                isHoveringDoor = false;
                document.body.style.cursor = 'default';
                doorMesh.material.emissive.setHex(0x000000);
            }
        }

        function openDoor() {
            isDoorOpen = true;
            document.getElementById('instruction').style.opacity = 0;
            
            // Start Audio/Lyrics
            setTimeout(() => {
                document.getElementById('lyrics-card').classList.add('visible');
                startExperience();
            }, 800); // Wait for door to open a bit
        }

        function resetExperience() {
            stopExperience();
            isDoorOpen = false;
            document.getElementById('lyrics-card').classList.remove('visible');
            setTimeout(() => {
                document.getElementById('instruction').style.opacity = 1;
            }, 1000);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 1. Door Animation (Lerp)
            if (doorGroup) {
                const targetRotation = isDoorOpen ? -Math.PI / 1.5 : 0; // Open outwards
                doorGroup.rotation.y += (targetRotation - doorGroup.rotation.y) * 0.05;
            }

            // 2. Particle Rotation
            if (particles) {
                particles.rotation.y += 0.001;
            }

            // 3. Gentle Camera Float
            const time = Date.now() * 0.0005;
            camera.position.x = Math.sin(time) * 5;
            camera.lookAt(0, 15, 0);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- TTS & LYRICS LOGIC ---

        function startExperience() {
            if (synth.speaking) return;
            isPlaying = true;
            
            const bgMusic = document.getElementById('bg-music');
            if(bgMusic.getAttribute('src')) {
                bgMusic.volume = 0.2;
                bgMusic.play().catch(e => console.log("Audio play blocked"));
            }

            currentLineIndex = 0;
            speakNextLine();
        }

        function stopExperience() {
            synth.cancel();
            isPlaying = false;
            const bgMusic = document.getElementById('bg-music');
            bgMusic.pause();
            bgMusic.currentTime = 0;
        }

        function speakNextLine() {
            if (!isPlaying || currentLineIndex >= lyrics.length) {
                // If finished or stopped, just stay open or reset manually
                return;
            }

            const text = lyrics[currentLineIndex];
            document.getElementById('lyrics-text').innerText = text;

            const u = new SpeechSynthesisUtterance(text);
            u.pitch = 1.1; 
            u.rate = 0.9;
            u.volume = 1;

            const voices = synth.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Google US English') || v.name.includes('Samantha'));
            if (preferredVoice) u.voice = preferredVoice;

            u.onend = () => {
                currentLineIndex++;
                if(isPlaying) setTimeout(speakNextLine, 500); 
            };

            synth.speak(u);
        }

        // Initial check for voices
        speechSynthesis.onvoiceschanged = () => { console.log("Voices loaded"); };
        
        // Init 3D Scene
        initThree();

    </script>
</body>
</html>
